<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crypto Pay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0b0d; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .app { width: 100%; max-width: 420px; background: #121418; border-radius: 24px; padding: 20px; border: 1px solid #222630; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 38px; height: 38px; border-radius: 50%; background: #f59e0b; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #000; }
    .brand-title { font-size: 18px; font-weight: 700; color: #fff; }
    .chip { background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .chip.on { background: #10b981; }

    .hero { background: linear-gradient(135deg, #1e2330 0%, #151821 100%); border-radius: 18px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a3040; }
    .lbl { font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
    .total { font-size: 32px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
    .feed { font-size: 13px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .act { background: #1a1e28; border: 1px solid #283040; border-radius: 14px; padding: 12px 6px; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    .act span { font-size: 18px; }

    .token-section { margin-bottom: 20px; }
    .token-title { font-size: 14px; font-weight: 600; color: #9ca3af; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .token-list { display: flex; flex-direction: column; gap: 10px; }
    .token-row { display: flex; justify-content: space-between; align-items: center; background: #161922; padding: 12px 14px; border-radius: 14px; border: 1px solid #242b38; cursor: pointer; }
    .token-info { display: flex; align-items: center; gap: 12px; }
    .token-names { display: flex; flex-direction: column; }
    .token-name { font-size: 14px; font-weight: 600; color: #fff; }
    .token-sym { font-size: 11px; color: #9ca3af; }
    .token-price { font-size: 14px; font-weight: 600; color: #10b981; font-variant-numeric: tabular-nums; }

    .gullak-card { background: #231c12; border: 1px solid #4a3818; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .gullak-title { font-size: 13px; color: #f59e0b; margin-bottom: 4px; }
    .gullak-bal { font-size: 20px; font-weight: 700; color: #fff; }

    .qr-box { background: #1a1e28; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #283040; margin-bottom: 20px; }
    .qr-box #main-qr { display: flex; justify-content: center; margin-top: 10px; }
    .qr-box #main-qr canvas, .qr-box #main-qr img { background: #fff; padding: 6px; border-radius: 10px; }

    nav { display: flex; justify-content: space-around; background: #151821; border-radius: 16px; padding: 12px; border: 1px solid #222735; }
    nav button { background: none; border: none; color: #9ca3af; font-size: 13px; cursor: pointer; }
    nav button.a { color: #f59e0b; font-weight: 600; }

    /* कार्यक्षम पॉपअप पॅनेल्स */
    .shade { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; justify-content: center; z-index: 9999; }
    .shade.open { display: flex !important; }
    .panel { background: #161922; width: 100%; max-width: 420px; border-radius: 24px 24px 0 0; padding: 20px; text-align: center; border: 1px solid #2a3040; }
    .grab { width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 16px; }
    .ttl { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
    .inp { position: relative; margin-bottom: 12px; }
    .inp input { width: 100%; background: #0a0b0d; border: 1px solid #2a3040; border-radius: 14px; padding: 13px; font-size: 15px; color: #fff; outline: none; }
    .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; background: #2563eb; color: #fff; border: none; cursor: pointer; }
    .btn.ghost { background: #0a0b0d; color: #9ca3af; margin-top: 8px; border: 1px solid #222630; }
    .msg { font-size: 12px; font-weight: 700; color: #ff5a6a; min-height: 18px; margin-bottom: 10px; }
    .msg.ok { color: #10b981; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-logo">P</div>
        <div class="brand-title">Crypto Pay</div>
      </div>
      <button class="chip" id="chip" onclick="connectWallet()">Connect</button>
    </header>

    <div class="hero">
      <div class="lbl">Total balance</div>
      <div class="total" id="total">&#8377;0.00</div>
      <div class="feed" id="feed"><span class="pulse-dot"></span> Live Rates Connected</div>
    </div>

    <!-- आता ही बटणे खरी काम करतील -->
    <div class="acts">
      <button class="act" onclick="openSend()"><span>&uarr;</span>Send</button>
      <button class="act" onclick="openReceive('SHM')"><span>&darr;</span>Receive</button>
      <button class="act" onclick="alert('Buy coming soon')"><span>+</span>Buy</button>
      <button class="act" onclick="alert('Swap coming soon')"><span>&#8644;</span>Swap</button>
    </div>

    <div class="token-section">
      <div class="token-title">
        <span>Live Token Rates (INR)</span>
        <span style="font-size: 11px; color: #10b981;">Live Feed</span>
      </div>
      <div class="token-list">
        
        <div class="token-row" onclick="openReceive('SHM')">
          <div class="token-info">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #111; display: flex; align-items: center; justify-content: center;">
              <svg viewBox="0 0 200 200" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                <polygon points="100,26 138,92 62,92" fill="#ffffff"/>
                <polygon points="56,102 94,168 18,168" fill="#ffffff"/>
                <polygon points="144,102 182,168 106,168" fill="#ffffff"/>
                <circle cx="100" cy="116" r="17" fill="#ffffff"/>
              </svg>
            </div>
            <div class="token-names">
              <span class="token-name">Shardeum</span>
              <span class="token-sym">SHM</span>
            </div>
          </div>
          <div class="token-price" id="price-shm">Loading...</div>
        </div>

        <div class="token-row" onclick="openReceive('BTC')">
          <div class="token-info">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #f7931a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;">BTC</div>
            <div class="token-names">
              <span class="token-name">Bitcoin</span>
              <span class="token-sym">BTC</span>
            </div>
          </div>
          <div class="token-price" id="price-btc">Fetching...</div>
        </div>

        <div class="token-row" onclick="openReceive('ETH')">
          <div class="token-info">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #627eea; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;">ETH</div>
            <div class="token-names">
              <span class="token-name">Ethereum</span>
              <span class="token-sym">ETH</span>
            </div>
          </div>
          <div class="token-price" id="price-eth">Fetching...</div>
        </div>

        <div class="token-row" onclick="openReceive('USDT')">
          <div class="token-info">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #26a17b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;">USDT</div>
            <div class="token-names">
              <span class="token-name">Tether</span>
              <span class="token-sym">USDT</span>
            </div>
          </div>
          <div class="token-price" id="price-usdt">&#8377;89.50</div>
        </div>

        <div class="token-row" onclick="openReceive('SOL')">
          <div class="token-info">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: #9945ff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px;">SOL</div>
            <div class="token-names">
              <span class="token-name">Solana</span>
              <span class="token-sym">SOL</span>
            </div>
          </div>
          <div class="token-price" id="price-sol">Fetching...</div>
        </div>

      </div>
    </div>

    <div class="gullak-card">
      <div class="gullak-title">Total in Gullak</div>
      <div class="gullak-bal">&#8377;0</div>
      <div style="font-size: 12px; color: #9ca3af; margin-top: 4px;">No gullak customers yet</div>
    </div>

    <div class="qr-box">
      <div style="font-size: 13px; color: #9ca3af; margin-bottom: 8px;">Scan QR to Pay</div>
      <div id="main-qr"></div>
    </div>

    <nav>
      <button class="a">Home</button>
      <button onclick="alert('Swap coming soon')">Swap</button>
      <button onclick="alert('Settings coming soon')">Settings</button>
    </nav>

    <!-- SEND PANEL -->
    <div class="shade" id="sheetSend">
      <div class="panel">
        <div class="grab"></div>
        <div class="ttl">Send SHM</div>
        <div class="inp"><input id="sendTo" placeholder="Recipient address (0x…)"></div>
        <div class="inp"><input type="number" id="sendAmt" placeholder="Amount in SHM" step="any"></div>
        <div class="msg" id="sendMsg"></div>
        <button class="btn" onclick="sendSHM()">Send Now</button>
        <button class="btn ghost" onclick="closeAll()">Close</button>
      </div>
    </div>

    <!-- RECEIVE PANEL -->
    <div class="shade" id="sheetReceive">
      <div class="panel">
        <div class="grab"></div>
        <div class="ttl" id="recTtl">Receive SHM</div>
        <div id="recQr" style="display:flex;justify-content:center;margin:12px 0;"></div>
        <div id="recAddr" style="font-family:monospace;font-size:11px;color:#9ca3af;word-break:break-all;background:#0a0b0d;padding:10px;border-radius:10px;margin-bottom:12px;"></div>
        <button class="btn" onclick="copyAddr()">Copy Address</button>
        <button class="btn ghost" onclick="closeAll()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const USDT_INR_RATE = 89.5;
    const CHAIN = '0x1fb6'; // Shardeum EVM 8118
    let addr = '';

    function closeAll() {
      document.querySelectorAll('.shade').forEach(s => s.classList.remove('open'));
    }

    function toWei(s) {
      if (!/^\d*\.?\d*$/.test(s) || s === '.' || s === '') return null;
      const [i, f = ''] = s.split('.');
      const w = BigInt(i || '0') * 10n ** 18n + BigInt((f + '0'.repeat(18)).slice(0, 18));
      return w > 0n ? w.toString() : null;
    }

    async function connectWallet() {
      if (window.ethereum) {
        try {
          const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
          addr = acc[0];
          document.getElementById("chip").innerText = addr.slice(0, 6) + "..." + addr.slice(-4);
          document.getElementById("chip").classList.add('on');
          renderMainQR();
        } catch (e) { alert("Connection rejected"); }
      } else {
        alert("Please install MetaMask!");
      }
    }

    function renderMainQR() {
      const box = document.getElementById('main-qr');
      box.innerHTML = '';
      new QRCode(box, { text: addr || 'https://shardeum.org', width: 130, height: 130 });
    }

    function openSend() {
      if (!addr) { alert('Please connect wallet first!'); return; }
      document.getElementById('sendMsg').innerText = '';
      document.getElementById('sheetSend').classList.add('open');
    }

    function openReceive(sym) {
      document.getElementById('recTtl').innerText = 'Receive ' + sym;
      document.getElementById('recAddr').innerText = addr || 'Connect wallet to see your address';
      const box = document.getElementById('recQr');
      box.innerHTML = '';
      new QRCode(box, { text: addr || 'https://shardeum.org', width: 140, height: 140 });
      document.getElementById('sheetReceive').classList.add('open');
    }

    function copyAddr() {
      if (!addr) return;
      navigator.clipboard.writeText(addr).then(() => alert('Copied!'));
    }

    async function sendSHM() {
      const to = document.getElementById('sendTo').value.trim();
      const amt = document.getElementById('sendAmt').value.trim();
      const msg = document.getElementById('sendMsg');
      const wei = toWei(amt);

      if (!to.startsWith('0x') || to.length !== 42) { msg.innerText = 'Enter valid 0x address'; return; }
      if (!wei) { msg.innerText = 'Enter valid amount'; return; }

      try {
        msg.className = 'msg';
        msg.innerText = 'Confirm in MetaMask…';
        const hash = await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{ from: addr, to: to, value: '0x' + BigInt(wei).toString(16) }]
        });
        msg.className = 'msg ok';
        msg.innerText = 'Sent ✓ ' + hash.slice(0, 10) + '…';
      } catch (e) {
        msg.className = 'msg';
        msg.innerText = e.message || 'Failed';
      }
    }

    async function fetchOneSecondTicker() {
      try {
        const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbols=[%22BTCUSDT%22,%22ETHUSDT%22,%22SOLUSDT%22]");
        const data = await res.json();
        data.forEach(item => {
          const usdPrice = parseFloat(item.price);
          const inrPrice = (usdPrice * USDT_INR_RATE).toFixed(2);
          if (item.symbol === "BTCUSDT") document.getElementById("price-btc").innerText = "₹" + Number(inrPrice).toLocaleString('en-IN');
          if (item.symbol === "ETHUSDT") document.getElementById("price-eth").innerText = "₹" + Number(inrPrice).toLocaleString('en-IN');
          if (item.symbol === "SOLUSDT") document.getElementById("price-sol").innerText = "₹" + Number(inrPrice).toLocaleString('en-IN');
        });
      } catch (err) {}
    }

    async function fetchShardeumLive() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=shardeum&vs_currencies=inr");
        const data = await res.json();
        if (data && data.shardeum && data.shardeum.inr !== undefined) {
          const liveSHM = data.shardeum.inr;
          document.getElementById("price-shm").innerText = "₹" + liveSHM;
          document.getElementById("feed").innerHTML = '<span class="pulse-dot"></span> Live SHM: ₹' + liveSHM;
        }
      } catch (e) {}
    }

    window.onload = () => {
      renderMainQR();
      fetchOneSecondTicker();
      fetchShardeumLive();
      setInterval(fetchOneSecondTicker, 2000);
      setInterval(fetchShardeumLive, 10000);
    };
  </script>
</body>
</html>
