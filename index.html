emote per listed item.\n\nIDENTITY: every emote must be unmistakably the SAME subject as the photo and as each other. Carry the subject's defining features into every single emote - face shape, skin/fur/surface color, hair style and color, facial hair, glasses, ears, markings, accessories - simplified into the art style but never dropped or changed between emotes. EYE COLOR IS PART OF IDENTITY: first read the subject's real eye (iris) color from the attached photo, then reproduce that SAME eye color faithfully and consistently in EVERY emote - it must match the person and stay identical across the whole set, never drifting, shifting hue, or changing from one emote to the next (blue eyes stay that same blue in all of them, brown stays that same brown). Keep the eye color the same even when the eyes are enlarged or stylized; only where an expression explicitly changes the eyes themselves (heart-shaped LOVE eyes, tightly squeezed-shut laughing eyes) may their shape change - any iris still visible keeps the true color. Do NOT copy the photo's pose or camera angle into the emotes - vary the pose freely to serve each expression. If the subject is a pet or a mascot character, keep its species, colors, and markings exact and give it expressive anthropomorphic emotion.\n\nREADABILITY AT TINY SIZE is the whole job: these will be seen at 28x28 pixels in a chat line. For every emote: exaggerate the expression to roughly 300% of natural - subtle does not exist at 28px; make the head fill almost the entire square canvas (face-crop framing, minimal empty margin, hands or props only if the expression demands them); use thick clean dark outlines around the silhouette and major features; keep eyes and mouth oversized - they do all the work; use a few flat high-contrast colors, no gradients, no fine texture, no background elements, no small details that vanish when shrunk. Each expression must be instantly distinguishable from the others at a glance. NEVER add text, labels, or captions of your own: text is allowed only where an expression's own description names specific letters (like GG, W, L), and then only 1-2 thick bold letters that stay legible at 28px.\n\nFORMAT - TRANSPARENCY IS A HARD REQUIREMENT: each emote is a square 1:1 PNG, at least 112x112 in design (draw large, keep it simple), delivered on a fully TRANSPARENT background with a REAL alpha channel. Reliable transparency is a two-step process you MUST perform for EVERY emote: (1) first render the emote of the subject on a CLEAN, PLAIN, SOLID single-color background - one flat uniform color, no scenery, no props behind the subject, no gradient, no pattern, and nothing carried over from the original photo's background - so the subject sits clearly separated on a simple canvas that is easy to cut out; (2) then use the extract-subject / background-removal tool on that clean render to isolate ONLY the subject on genuine transparency, and deliver that transparent cutout. Run the extract-subject background removal on ALL emotes without exception - never skip it for any emote, and never leave any emote with its background still showing. Do not draw or simulate a checkerboard, gray grid, white square, or any background pattern - a drawn checkerboard is an automatic failure; the pixels around the subject must be genuinely transparent. If any emote comes back with its background not removed (still opaque, still showing a backdrop, or showing a fake checkerboard), redo the background removal on that one until it is a clean transparent PNG - do not drop it.\n\nDELIVERY: return each emote as its OWN separate square image - one transparent PNG per listed expression, nothing combined into sheets or grids. Deliver the COMPLETE set: exactly as many finished transparent emotes as there are expressions in the pack, with none skipped, dropped, or left with its background attached.\n\nSTYLE IS A HARD REQUIREMENT: render every emote strictly in the requested art style, following the style's description literally - it overrides your default rendering habits and applies to every emote in the pack equally. The subject's identity features are translated INTO the style, never rendered in a different style against it.\n\n=== USER INPUT ===\n\nEmote pack:\n{{pack}}\n\nStyle: {{style}}\n\nExtra notes: {{notes}}\n90:T205f,OUTPUT CONTRACT — obey exactly; this overrides any other reading of the instructions below:\n• Produce EXACTLY 6 images total — one per shot in the chosen category's shot list. No more, no fewer.\n• Each image is its OWN standalone VERTICAL 9:16 frame (portrait, clearly taller than wide). Every single image must be 9:16 — including close-ups.\n• NO grids, collages, contact sheets, side-by-sides, diptychs, variations, alternates or retries of any shot.\n• NO added text, captions, titles, labels, stickers, logos, watermarks or graphics anywhere in any image.\n• STOP after the sixth image.\n\nGenerate 6 distinct, separate, imperfect-framing and lighting, person-in-photo UGC-style phone camera photos of the exact product shown across the provided multi-angle reference images.\n\nProduct size, as specified by the user: `{{size}}`\n\nRender the product at exactly this size relative to hands, faces and furniture. Check it against the hand holding it — a small object is largely enclosed by the fingers; a large one dwarfs the hand. Never inflate a small product to make it more visible.\n\nOUTPUT: exactly 6 images, one per shot below, each its own standalone vertical 9:16 snapshot. No variations, no retries, no two alike. Never a grid, collage or composite. Stop after the sixth.\n\nPRODUCT LOCK: strictly base the product's shape, proportions, colors, materials, textures, labels, text, logos and every visible detail exclusively on the uploaded reference photos. Do not invent, add or hallucinate any unseen parts or features. If the reference images have poor or uneven lighting, subtly improve exposure and clarity to make details visible while keeping a natural unretouched phone-camera aesthetic.\n\nPEOPLE: each photo features a different person, and each must be a logical owner of this product — someone from its actual largest target audience. Invent six new people for this run: specific, ordinary faces you'd see in a supermarket, not a catalogue. Vary age, build, hair and style within the real audience. Never reuse a cast between runs. Everyone is having a fine ordinary day — relaxed, warm, at ease. Never frowning, tense, bored, tired or blank, and never a performed smile at the lens.\n\nLOOK: casual, slightly imperfect phone-snapshot composition, natural skin texture and fine lines, authentic shadows, natural reflections. Real phone camera qualities: slight grain, natural color cast, believable depth of field. No portrait-mode blur. No studio polish, no commercial lighting, no over-sharpening, no plastic smoothness, no added text or logos, no changes to the product itself. Infer the brand's vibe from the reference photos where possible.\n\n**STEP 1: Classify the product into ONE category below. Use that category's shot list, settings and lighting. Ignore the other categories entirely.**\n\n**BEAUTY \u0026 SKINCARE — serums, cleansers, makeup, hair products and tools**\nAudience: skews female, late teens to 40s, occasionally older for anti-ageing.\nShots: 1) bathroom mirror selfie, phone visible, product held near the face · 2) extreme close-up of application on skin or hair, face partly in frame · 3) fresh-faced after-use portrait in bathroom light, skin visibly good · 4) the shelfie — product among their other bottles on a cluttered shelf or counter, hand reaching in · 5) morning routine at the sink, mid-step, not looking at camera · 6) held up beside the face in bedroom light, easy smile.\nLight: bright bathroom daylight, warm bedroom lamp, harsh-ish vanity light on one. Settings: bathroom, bedroom, vanity.\n\n**SUPPLEMENTS \u0026 WELLNESS — powders, capsules, drinks, sleep aids**\nAudience: 25–45, health-conscious, gym-adjacent or busy-professional.\nShots: 1) scoop mid-pour into a glass or shaker on a kitchen counter · 2) the mixed drink held up, product tub behind it · 3) taking it as part of a morning routine, kitchen, mid-action · 4) product on a counter among coffee, keys and a water bottle · 5) post-workout, slightly sweaty, drinking it · 6) evening wind-down version if the product suits it — bedside, lamp light.\nLight: bright morning kitchen daylight, cool gym light, warm bedside lamp. Settings: kitchen, gym bag, bedside.\n\n**APPAREL \u0026 ACCESSORIES — clothing, bags, shoes, jewellery, activewear**\nAudience: matches the garment's own demographic exactly.\nShots: 1) full-length mirror selfie, phone in frame, whole outfit visible · 2) fit check turning slightly, caught mid-movement · 3) close detail — fabric, stitching, hardware, on the body · 4) worn out in the world, candid, shot by a friend · 5) laid on a bed with other items, overhead haul shot, hands in frame · 6) sitting somewhere casual, wearing it, relaxed and unposed.\nLight: bedroom daylight, hallway mirror light, outdoor overcast or golden. Settings: bedroom, hallway, outside.\n\n**FOOD \u0026 BEVERAGE — snacks, drinks, meal kits, sauces**\nAudience: broad; skew to the product's price and occasion.\nShots: 1) the bite or the sip, mid-action, close · 2) genuine reaction right after tasting · 3) the pour or the plate-up, hands and product · 4) packaging open on a counter mid-preparation, ingredients around · 5) in the fridge or the cupboard among real groceries · 6) shared at a table, someone reaching in.\nLight: bright kitchen daylight, warm dinner-table lamp, cool fridge light. Settings: kitchen, dining table, sofa.\n\n**HOME \u0026 KITCHEN — gadgets, tools, cleaning, organisation**\nAudience: 25–55, homeowners and renters, practical buyers.\nShots: 1) the product doing its job in close-up, hands only, no face · 2) the result — the clean surface, the finished dish, the organised drawer · 3) person mid-use, looking down at the task, absorbed · 4) before-and-after style single frame if the product transforms something · 5) sitting on the counter where it lives, in context · 6) person stepping back looking pleased at the result.\nLight: hard kitchen daylight, overhead utility light, warm evening. Settings: kitchen, bathroom, laundry, garage.\n\n**BABY \u0026 PARENTING — gear, feeding, sleep, toys**\nAudience: parents 25–40, tired and practical.\nShots: 1) parent using it with the baby, absorbed, not looking at camera · 2) close on the product in use, hands and baby only · 3) the baby using or wearing it, parent partly in frame · 4) in the nappy bag or on the changing table among real clutter · 5) parent one-handed, mid-task, real domestic chaos around · 6) calm moment after — the thing worked, quiet relief.\nLight: soft nursery daylight, dim night-light, bright living room. Settings: nursery, living room, car, changing table.\n\n**PET — food, toys, beds, grooming, accessories**\nAudience: 25–55, the pet is the point.\nShots: 1) the pet using, eating or wearing it, owner's hands only · 2) pet mid-action with it, slightly blurred, candid · 3) owner and pet together, owner watching the pet, not the camera · 4) product on the floor among the pet's other things · 5) close on the pet's face with the product in frame · 6) walk or outdoor use if the product suits it.\nLight: living-room daylight, kitchen floor light, outdoor overcast. Settings: living room, kitchen floor, garden, on a walk.\n\n**TECH \u0026 TRAVEL ACCESSORIES — cases, chargers, earbuds, bags, organisers**\nAudience: 22–45, commuters, travellers, remote workers.\nShots: 1) in use in the real context — desk, train, airport, car · 2) close on hands operating or opening it · 3) packed with its actual contents, spread on a surface, hands sorting · 4) clipped to a bag or in a pocket, on the move, mid-stride · 5) on a desk or table among everyday things, person behind it doing something else · 6) person glancing at the camera mid-use, relaxed.\nLight: office daylight, train window light, warm desk lamp, airport fluorescents. Settings: desk, train, airport, car, hallway.\n\n**STEP 2: Generate the six shots for the chosen category. Vary the room, time of day, camera distance and angle across them. No more than two photos have the person looking at the lens.** Output each of the six as a separate vertical 9:16 portrait image (taller than wide), even the close-ups — never a horizontal or square frame, and exactly six in total.\n\n=== USER INPUT ===\nProduct size: {{size}}\nExact size: {{custom_size}}\nVibe notes: {{vibe}}91:Ta1c,Design ONE original, production-ready GAME MASCOT character from the concept under USER INPUT — a single clean full-body character render, centered on a keyable background, ready to drop into a game, a store page, or straight into Character Sprite Maker to be animated.\n\nWHAT MAKES A GREAT MASCOT (the whole craft):\n- ONE character, instantly readable, bursting with personality — a clear archetype a player remembers after a single glance.\n- A STRONG ICONIC SILHOUETTE: pose and shapes read even as a solid black shape. Chunky, confident, well-separated forms; no thin fiddly bits that vanish at small sizes.\n- Big expressive eyes / face, an appealing modern character-design sensibility, and a distinct color identity.\n- ORIGINAL: invent the character; never copy or closely imitate an existing brand, franchise, or trademarked mascot, even if asked.\n\nFRAMING (non-negotiable, so the mascot is sprite/cutout ready):\n- FULL BODY head-to-toe, the ENTIRE character fully inside the frame with generous even margin on all four sides.\n- Centered, standing hero pose facing the viewer (unless the concept implies a signature stance).\n- Isolated on the chosen BACKGROUND, absolutely nothing else in the scene: no text, no logo, no watermark, no drop shadow, no ground plane, no extra props outside the character.\n- Output a single clean image.\n\nART STYLE — render in the style specified under USER INPUT; if none is given, use the polished 2D game mascot style: bold clean dark outlines, vibrant saturated colors, soft cel shading, chunky readable shapes, big expressive eyes, high contrast, crisp edges, no photorealism.\n\nCOLOR — if a palette is given under \"Palette\", build the character's identity around it (one or two dominant hues + an accent); otherwise choose a bold, high-contrast palette that fits the concept and gives the mascot a memorable color signature.\n\nBACKGROUND — follow the background specified under USER INPUT; if none is given, deliver the mascot as a clean cutout on a fully transparent background (alpha), edges tight, ready to composite.\n\nPAIRS WITH CHARACTER SPRITE MAKER: this mascot is built sprite-base ready — a full-body, centered, strong-silhouette character on a keyable background. Hand the result to Character Sprite Maker to turn it into animated, engine-ready sprite sheets (idle / run / attack and more).\n\nONE SHOT: do not ask questions; use sensible defaults for anything the form leaves open.\n\n=== USER INPUT ===\nMascot concept: {{concept}}\nStyle: {{art_style}}\nPalette: {{color_palette}}\nBackground: {{background}}\nExtra notes: {{notes}}\n92:T1109,ROLE: Expert graphic designer creating professional, high-impact editorial typographic product posters with Grok Imagine.\n\nWork in a SINGLE turn: the product picture(s) are attached and the mode + copy are provided in the message below. Do NOT ask clarifying questions; proceed with sensible defaults.\n\nPER-IMAGE RULE (both modes): Create ONE complete, ready-to-use vertical poster (9x16) for EACH\nattached picture. Never combine products across pictures — each user-uploaded picture gets its own poster.\nUse only the product(s) in that single picture. Output only the finished poster image(s).\n\n=== SHARED STYLE DNA (both modes) ===\nThis is the editorial typographic product poster school — the boutique, \"this was art-directed\" end:\n\nGOVERNING IDEA: Type is the hero, not a label — it IS the artwork. One loud display voice carries the\nwhole mood; everything else is quiet and functional. The size jump between them is extreme (hero word\n~10–15x the small print). That violent contrast is the look. Evenly-sized type reads as a brochure, not a poster.\n\nTYPE VOICES (use two, three max, in fixed roles):\n- DISPLAY voice: the big characterful face that sets the emotional tone (brand name or one benefit word).\n  This is where personality and boldness live.\n- FUNCTIONAL voice: a plain, neutral sans for ALL small copy (flavor, benefit, size, origin, fine print).\n  Almost always a clean grotesque (Inter/Helvetica-like) even when the hero is a serif/script — it must\n  vanish and stay legible. Captions are plumbing, not personality.\n- ACCENT voice (optional): a script/italic on just ONE or TWO words for tension against the display\n  (\"tasty MORNING,\" \"ICED\" + script \"creamy\"). Sparingly — never a whole headline.\n\nDISPLAY FACE BY FEELING (personality match — what is the product selling?):\n- Coffee / bakery / comfort food → heavy chunky grotesque or bold condensed sans, often a script accent.\n- Beauty luxury/feminine → high-contrast Didone serif (Bodoni/Playfair), tight tracking, lots of air.\n- Beauty clinical/clean → plain modern sans.\n- Fragrance / luxury / fashion → restrained high-contrast serif, wide spacing, minimal everything.\n- Health / protein / sports → confident geometric or grotesque sans, uppercase, bold.\n- Furniture / home / heritage / vintage → transitional/slab serif or retro display face.\n- Sale / youth / streetwear → heavy condensed caps, or brush/graffiti script for energy.\nShorthand: warmth/craft → serif or script; modern/functional → sans; luxury → high-contrast serif;\nloud-and-fun → heavy condensed caps.\n\nTYPE BEHAVIOR:\n- Case: display = bold UPPERCASE for impact OR styled lowercase script; micro-copy = UPPERCASE, wide\n  letter-spacing; subhead/description = sentence case, neutral sans.\n- Spacing: big display = tight tracking + tight leading (reads as one solid mass); tiny labels = wide-tracked.\n- Scale: commit to the jump. If the hero is huge, support text should feel almost too small. No mid-sized\n  type competing in between.\n- Color: ONE color world — a single tonal palette (oxblood, cream, lilac, brown, sage, pink, etc.) shared by\n  background, product, and type. Keep type to one or two colors from that palette. Never a rainbow.\n- Placement: display type is a graphic element — it may bleed off edges and overlap/sit behind the product.\n- Micro-copy: 3–5 tiny wide-tracked uppercase callouts pinned in the corners to frame the hero without crowding.\n\nTHE EARNED SURPRISE: Pick your defaults from above, then deliberately break exactly ONE convention for\ndistinctiveness (a serif where everyone uses a sans; one word in an unexpected script). One earned surprise,\neverything else disciplined.\n\nUNIVERSAL DESIGN RULES:\n- Bold, highly readable text with strong hierarchy; the headline clearly dominates.\n- High-quality, relevant staging/elements that fit the theme; clean, balanced composition, good spacing.\n- All provided text integrated crisply, legibly, and correctly spelled.\n\nMODE — the chosen mode (MAXIMAL or MINIMAL) arrives fully specified under USER INPUT; execute it exactly.\n\nOUTPUT: One finished vertical 9x16 poster per attached picture. Text crisp, correctly spelled, strong\nhierarchy, hero word stands out.\n\n=== USER INPUT ===\nMode: {{mode}}\nHero word / headline: {{hero}}\nSubhead / details: {{subhead}}\nMicro-copy labels (3-5 short): {{labels}}93:Tf82,Transform the attached photo into a professional studio-grade headshot suitable for LinkedIn, a company directory, or a resume, using the attire specified under USER INPUT.\n\nFIRST, VALIDATE THE SOURCE PHOTO - before anything else, check that the attached photo clearly shows the person's face. If the face is occluded, turned away from the camera, cropped out of frame, or too small or too blurred to confidently identify the person, DO NOT generate any image. Reply in text only, stating that a clear photo of the person's face is needed to create a professional headshot, and briefly say what was wrong with this one (for example: the face is hidden or turned away). Fabricating an identity is the one unforgivable failure for this skill - a confident headshot of an invented face is far worse than no image at all. When in doubt about whether the face is identifiable, decline.\n\nTHE PERSON MUST REMAIN UNMISTAKABLY THE SAME PERSON - identity fidelity overrides every stylistic goal. Preserve exactly: face geometry and proportions, eye shape and color, nose, mouth, jawline, ears, skin tone and real skin texture, exact hair color, and exact hair style, texture, length, and hairline detail, forehead size, facial hair exactly if there is any in the user-uploaded photo, and the person's actual body type and apparent age. Do not slim the face or body, do not de-age, do not enlarge the eyes, do not straighten or whiten teeth beyond how they appear in the source, and do not airbrush the skin smooth.\n\nProfessionalize ONLY these:\n\n- Attire: dress the person in the requested attire EXACTLY as described, fitted naturally to their actual build - the attire choice must be obvious at a glance (a suit must read as a suit with jacket and tie/formal blouse; business casual must clearly have no tie; creative must have no collar or jacket).\n- Backdrop: replace the background with a clean professional backdrop that suits the person and the attire - a seamless studio shot background, a bokeh realistic modern office, open bokeh realistic daylight outdoors, or a bokeh minimalist indoors interior.\n- Lighting: soft, flattering professional portrait lighting - a gentle key with soft fill, natural catchlights in the eyes, no harsh shadows, no blown highlights.\n- Pose and framing: frame as a classic head-and-shoulders crop with the eyes in the upper third and a little headroom (the standard for LinkedIn and directory photos); shoulders angled slightly, face toward the camera, posture confident and relaxed, expression natural and approachable, close to the expression in the source (a slight professional smile is ideal). If the source shows an unusual, exaggerated, playful, or inappropriate posture, gesture, or expression - for example dabbing, a peace sign or other hand signs, arms raised or flailing, a dramatic lean, or a silly face - do NOT reproduce it: reframe the SAME person into this natural, relaxed, professional head-and-shoulders pose with a neutral-friendly expression, keeping their identity, face, likeness, and hair intact (attire and backdrop still follow USER INPUT).\n- Cleanup: subtly neaten stray hairs and clothing wrinkles, and remove photographic defects (noise, motion blur, red-eye, harsh on-camera flash) - while keeping skin texture detailed.\nIf the person wears glasses on their nose and eyes in the source, keep the same glasses with no lens glare. Keep any visible cultural or religious head covering exactly as worn. If the source contains more than one person, the subject is the most prominent person. Output 2-3 photorealistic portrait-orientation headshots of the SAME person in the SAME attire - each a different tasteful variation (a different angle, pose, or backdrop treatment), every one meeting every rule above. Never more than 3 pictures. Stop at 3. If the user’s input picture is hrizontal aspect ratio, still generate a vertical format for the output.\n\n=== USER INPUT ===\nAttire: {{attire}}\nExtra notes: {{notes}}\n5d:[\"$\",\"body\",null,{\"dir\":\"$undefined\",\"className\":\"geist_mono_751d53b5-module__CetxfG__variable ibm_plex_mono_dd7e49e9-module__0eBxKW__variable inter_7f3390d8-module__sEGfFG__variable universalsans_661f68e9-module__1v96Qa__variable universalsansdisplay_168ff884-module__9xjxqG__variable vazirmatn_1cfc912f-module__LWuCHG__variable antialiased font-body text-fg-primary overflo ide ample negative space for storefront layout.\",\"videoPrompt\":\"Very subtle cinematic pan to the right, keeping the object centered in the frame throughout. Steady, smooth, aesthetic.\",\"templateType\":\"I2I2V\",\"videoPreviewURL\":\"https://imagine-public.x.ai/imagine-public/share-videos/7b097052-8cfe-4b0f-8a33-c2a71e1aed25.mp4\",\"postID\":\"7b097052-8cfe-4b0f-8a33-c2a71e1aed25\",\"description\":\"Creates a clean studio product photo with soft lighting and a smooth pan.\"},{\"title\":\"Roman Empire\",\"imagePrompt\":\"$7e\",\"templateType\":\"I2I\",\"postID\":\"9d8f6c8e-3507-4f38-a022-3c14f6fbbd91\",\"description\":\"Travel back in time to the age of great Roman Emperors.\"},{\"title\":\"Fire Horse\",\"imagePrompt\":\"Subject is riding on a beautiful vibrantly red giant porcelain horse, positioned in front of the great wall of china. Slightly grainy film texture. Low dramatic epic angle. Beautiful framing. High resolution, up close framing of subject upper body. Low light background. Subject has a neutral facial expression.\",\"videoPrompt\":\"Horse begins galloping, background becomes darker and golden/yellow fireworks go off in background.\",\"templateType\":\"I2I2V\",\"postID\":\"808ab93b-ec7f-4052-964b-5174c908db1d\",\"description\":\"Rides a giant red porcelain horse galloping by the Great Wall with fireworks.\"},{\"title\":\"Video Game\",\"imagePrompt\":\"A character rendered in authentic early-2000s PlayStation 2 / Nintendo 64 video game style, with very low-poly geometry, blocky limbs, and angular facial features. The character has simple, flat textures, visible texture stretching, and low-resolution diffuse maps, with no skin pores, no fine detail, and no realism.\",\"templateType\":\"I2I\",\"postID\":\"f51ad8c5-9dfa-4436-8c5a-9f0e95f78483\",\"description\":\"Turns life into a video game.\"},{\"title\":\"Ad Astra\",\"imagePrompt\":\"The subjects are suspended in space, wearing spacesuits. Retain likeness and any original head accessories if present. Entire image is black and white.\",\"videoPrompt\":\"They are gently floating through space, subtly happy and in awe.\",\"templateType\":\"I2I2V\",\"postID\":\"9068fa4b-4805-467c-b2d3-0cb503356052\",\"description\":\"Floats you through space in a black-and-white spacesuit.\"},{\"title\":\"Balloon Flight\",\"imagePrompt\":\"Turn the core characters from the image into inflated, glossy vinyl Balloons figure with huge, oversized eyes, gently floating and rising up into the sky. The balloons only have the overinflated, rounded upper body and arms. A thread holds the bottom of the balloon. Highly reflective smooth plastic surface, subtle seam lines, gentle pressure wrinkles, shiny toy-like finish, soft, inflated human face with slightly simplified features, cinematic studio lighting, centered portrait, ultra-detailed, polished inflatable character aesthetic， medium close-up shot.\",\"videoPrompt\":\"The printed eyes of balloons are static; the balloons float purely upward; the balloons themselves are completely rigid, devoid of any movement. The camera tracks the balloon statically, ensuring it remains centered within the center of the frame.\",\"templateType\":\"I2I2V\",\"postID\":\"3075a66c-40f6-47ed-b86a-6a649a7bdf0b\",\"description\":\"Turn yourself into a balloon and rise high into the sky.\"},{\"title\":\"Go Skiing\",\"imagePrompt\":\"Subjects skiing down a snowy mountain. Preserve outfit.\",\"videoPrompt\":\"Skiing in a zigzag carving motion.\",\"templateType\":\"I2I2V\",\"postID\":\"099aeb0e-6221-4a45-889c-f90b6626a627\",\"description\":\"Skiing down a snowy mountain carving turns.\"},{\"title\":\"Laser Fight\",\"imagePrompt\":\"the subjects each hold a blue, futuristic lightsaber sword in their hands\",\"videoPrompt\":\"the characters start fighting with the lightsaber in a controlled, elegant way. cinematic darkness emerges.\",\"templateType\":\"I2I2V\",\"postID\":\"c9614d47-b75d-40c2-b9cf-97394c099b9d\",\"description\":\"Fights with glowing blue lightsabers.\"},{\"postID\":\"468c842f-26c3-4f08-8d50-ee3e6b60b1b1\",\"title\":\"Future Family\",\"prompt\":\"Add their children looking like them and dressed similarly.\",\"description\":\"Adds kids who look like you.\"},{\"postID\":\"7be5f03e-0484-4a12-aad7-f14159820ffa\",\"title\":\"Club Beats\",\"prompt\":\"Create a short video animation starting from the uploaded static image of a person. The subject(s) begins without any accessories, facing forward with a neutral expression. Smoothly animate them reaching up and putting on large black visor-style sunglasses that cover their eyes completely, followed by sliding on bulky over-ear headphones or ear protectors. Once equipped, have them start nodding their head rhythmically to upbeat music, with subtle body sways, maintaining a cool, intense vibe like a video game character. Cinematic lighting illuminates the face of the subject and the camera dolly's in as the subject continues bopping their head, keeping the body movement realistic and fluid.\",\"description\":\"Puts on sunglasses and headphones then grooves to club beats.\"},{\"title\":\"Simulationship\",\"imagePrompt\":\"The subject is running in a field with a few flowers, ultra grainy and low saturation 90's film aesthetic retro, holding the hand of silhouette figure that has a vintage neon green grid pattern (almost like a simulation character), they are running through a grassy field on a sunny day, a few flowers in the field. Both subjects are joyous.\",\"videoPrompt\":\"Subjects continue holding hands playfully running through the grass, almost dream-like.\",\"templateType\":\"I2I2V\",\"postID\":\"117cd5d1-ba11-4e93-bd93-160c4f92babf\",\"description\":\"Runs hand-in-hand through a flower field with a glowing simulation figure.\"},{\"postID\":\"ad4741bf-8f64-43f8-bba4-9097b5b5a14d\",\"title\":\"Let it Snow\",\"prompt\":\"A powdery snowball thrown at the subject hitting them in their face, snowball bursting into powdery snow on impact. Funny and harmless. The character looks slightly upset looking in the direction from where the snowball came and calling toward that direction at someone beyond the camera.\",\"description\":\"Gets hit in the face by a snowball.\"},{\"postID\":\"55c2e33d-94f1-49e2-bee4-0984cb28e7be\",\"title\":\"Bear Buddy\",\"prompt\":\"A giant alive and real polar bear walks up to the subject sitting next to the subject, and the subject pats the bear as the bear softly snuggles the subject. One continuous shot, no cuts.\",\"description\":\"Cuddles with a giant friendly polar bear.\"},{\"postID\":\"3c36fe5c-01ce-4a74-8102-d8eaa8443e66\",\"title\":\"Cuddle a Squirrel\",\"prompt\":\"A little squirrel runs up the shoulder of the subject, and they touch noses softly and sweetly.\",\"description\":\"A squirrel climbs your shoulder for a nose touch.\"},{\"postID\":\"7a668278-27c6-497e-96ea-552740c4ab15\",\"title\":\"Helicopter Escape\",\"prompt\":\"A rescue rope drops from above as the subject grabs it and vanishes skyward. Action-packed, cinematic getaway\",\"description\":\"Grabs a rope and escapes by helicopter.\"},{\"title\":\"Sunny Morning\",\"imagePrompt\":\"$7f\",\"templateType\":\"I2I\",\"postID\":\"7ad8ee24-d5d5-4688-84bb-b221cddc5dd7\",\"description\":\"Warm golden-hour morning scene with film look.\"}]},\"enable_settings_subscription_section_v2\":true,\"show_early_access_models_setting\":false,\"require_connector_feedback\":false,\"enable_pipeline_templates\":true,\"enable_gateway_chat\":true,\"nsfw_enabled\":false,\"disable_sharing\":false,\"disable_dev_models\":true,\"enable_table_paste_as_markdown\":false,\"enable_dictation_refinement\":true,\"enable_gmail_integration\":true,\"enable_pbt\":true,\"enable_feedback_attachments\":true,\"enable_code_terminal\":false,\"enable_google_drive_integration_imagine\":true,\"restrict_edit_and_regen_to_latest_msg\":false,\"imagine_show_paywall_web\":false,\"use_exceljs\":false,\"enable_grok_computer\":true,\"xlsx_exceljs_light_default\":true,\"hide_old_debug_tools\":true,\ \"value\":\"Photo enhance\",\"prompt\":\"Dramatically improve this photo into a polished, professional-quality portrait while keeping the same person, same pose, same clothing, and same location. Re-light the subject with flattering soft directional key light and gentle fill so the face is bright, dimensional, and clearly separated from the background — eliminate flat, dull, or overhead lighting. Add depth of field: render the background with natural, creamy optical blur so the subject pops, and clean up background clutter and distracting bright spots. Apply a rich, film-like color grade with deep clean blacks, luminous highlights, and vivid but natural color.\\n\\nCritical constraints: preserve the person's exact same face, eyes, skin and appearance.\"},{\"label\":\"Remove Object\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_remove_object.jpg?v=5\",\"value\":\"Remove Object\",\"prompt\":\"Remove the specific unwanted object or person the user describes. Fill the area naturally so it looks like the object was never there. Preserve the exact appearance of the person that's the main subject of the photo. Do not change anything about them, just remove the object they want to remove.\"},{\"label\":\"Professional Polish\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_professional_polish.jpg?v=1\",\"value\":\"Professional Polish\",\"prompt\":\"Transform this casual photo into a polished, professional-quality portrait of the exact same person, clothing, jewelry, and location. Re-light the subject with soft directional key light from a flattering angle plus gentle fill so their face is bright, dimensional, and clearly separated from the background, eliminating flat or overhead lighting. Add natural creamy optical depth of field that renders the background with smooth bokeh blur, cleaning up clutter and distracting bright spots so the subject pops forward. Apply a rich film-like color grade featuring deep clean blacks, luminous highlights, and vivid yet natural colors. The final image must look like the same person captured by a professional photographer with excellent lighting and a fast lens.\"},{\"label\":\"Background Changer\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_background_changer.jpg?v=6\",\"value\":\"Background Changer\",\"prompt\":\"Replace the entire background with a new one that the user describes. Keep the main subject sharp and correctly lit for the new background. Make sure that the proportion of the main subject of the picture is logical compared to the background proportions so the main subject does not lok overly big or overly small compared to the new background.\"},{\"label\":\"Isolate Person\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_isolate_person.jpg?v=5\",\"value\":\"Isolate Person\",\"prompt\":\"Isolate the person the user describes into a portrait of them in the same setting but by themselves. Remove everyone else just keep the original setting and the close up portrait of the person. If the person is wearing anything on their face, keep it exactly the same. Maintain their facial features precisely.\"},{\"label\":\"Black \u0026 White\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_black_and_white.jpg?v=3\",\"value\":\"Black \u0026 White\",\"prompt\":\"$81\"},{\"label\":\"Cozy Warm\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_cozy_warm.jpg?v=3\",\"value\":\"Cozy Warm\",\"prompt\":\"$82\"},{\"label\":\"Sharpen Details\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_sharpen_details.jpg?v=4\",\"value\":\"Sharpen Details\",\"prompt\":\"Increase sharpness, texture, and micro-contrast throughout the image for crisper, more defined details. Enhance edge definition and fine detail in the hair, clothing, eyes, and background while keeping the overall look natural and realistic. Do not change colors, tones, lighting, composition, or the subject's appearance beyond the added clarity and sharpness.\"},{\"label\":\"Blur Background\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/photo_edit/photo_edit_blur_background.jpg?v=1\",\"value\":\"Blur Background\",\"prompt\":\"Keep the main subject sharp and add natural background blur/bokeh.\"}]}],\"textInputs\":[{\"id\":\"details\",\"label\":\"Details\",\"required\":false,\"placeholder\":\"e.g. remove the cars / change background to a beach — needed only for Remove Object, Background Changer, or Isolate Person\"}],\"imageInputs\":[{\"id\":\"photo\",\"label\":\"Your photo\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"inputOrder\":[\"photo\",\"edit\",\"details\"],\"promptTemplate\":\"$83\",\"coverImageUrl\":\"https://media.x.ai/v1/website/photo_edit-15e1618f.jpg\",\"coverDimensions\":{\"width\":1408,\"height\":1408},\"coverVerticalImageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/photo_edit/photo_edit_vertical.jpg?v=20260722\",\"coverVerticalVideoUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/photo_edit/photo_edit_vertical.mp4?v=20260723\",\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-19-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-19-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-33-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-33-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-48-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-48-output.jpg?v=20260723\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-01-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-01-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-24-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/photo_edit/variants/PHE-24-output.jpg?v=20260723\"}]},{\"id\":\"segment-photo\",\"title\":\"Precise Edit\",\"promptTemplate\":\"\",\"textInputs\":[],\"imageInputs\":[],\"coverImageUrl\":\"https://media.x.ai/v1/grok-web/precise_edit_thumb-6671fd53.png\",\"coverVideoUrl\":\"https://media.x.ai/v1/grok-web/precise_edit-e8ec5d39.mp4\",\"coverDimensions\":{\"width\":1400,\"height\":1400}},{\"id\":\"imagine-restyle\",\"title\":\"Reimagine\",\"description\":\"Reimagine your photo into a chosen look — chibi, comic, 3D, 70s street, 80s anime, or a warm Sunday-morning film look.\",\"category\":\"Photo Tools\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image Editing\"}],\"presetInputs\":[{\"id\":\"style\",\"label\":\"Style\",\"description\":\"Pick a style — or select several to get a version in each. Choosing one or several styles are both valid; each selected style produces its own separate restyled image.\",\"required\":true,\"multiSelect\":true,\"options\":[{\"label\":\"Chibi\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_chibi.jpg?v=3\",\"value\":\"Chibi\",\"prompt\":\"Create a cute anime chibi character of the person from the image, rendered as a high-quality glossy 3D blender style figurine: smooth reflective toy-like plastic materials, strong specular highlights, soft reflections, shiny surfaces. Preserve the person's original race, ethnicity, skin tone, hair color, facial likeness, eye color, and clothing colors precisely. Use classic chibi proportions with a very large head, small torso, simplified cute features, and large over-sized expressive sparkling eyes. Frame from the torso up with the upper body and head filling most of the frame. The person looks directly at the camera with an energetic, pose fit for this type of environment and scene. Preserve the environment that the person is in as the background, making it slightly bokeh.\"},{\"label\":\"Comic Book\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_comic_book.jpg?v=2\",\"value\":\"Comic Book\",\"prompt\":\"Transform the input image into an original comic-book / graphic-novel illustration style while preserving the subject's recognizable identity, pose, clothing, and everyday setting. Reinterpret the scene as a single panel from a slice-of-life indie comic: an ordinary, mundane 'day in the life' moment (e.g. sipping coffee, commuting, walking the dog, at a desk, cooking) — calm and relatable, NOT action or heroic. Use bold black ink outlines, clean confident linework, flat cel-shaded color blocks, and halftone / ben-day dot shading with subtle vintage newsprint texture. Keep the face recognizable but lightly stylized. Do NOT add superheroes, capes, costumes, masks, powers, logos, emblems, speech bubbles, sound effects, or any text. Absolutely no copyrighted, trademarked, or franchise characters or styles — a completely original, generic comic look applied to a real everyday scene.\"},{\"label\":\"3D Character\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_3d_character.jpg?v=3\",\"value\":\"3D Character\",\"prompt\":\"Create a charming cartoon character of the person from the image. Frame from the torso up with the upper body and head filling most of the frame. Pose, cute and charismatic personality, polished high-quality 3D cartoon style, highly detailed, professional illustration. Maintain the original face, structure and hair details. Preserve the environment that the person is in as the background, making it slightly bokeh.\"},{\"label\":\"70's Street Style\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_70s_street.jpg?v=4\",\"value\":\"70's Street Style\",\"prompt\":\"1970s NYC candid street photograph of the person or people (if there are multiple people in the user-uploaded photo) in typical 70s outfit, close up picture. avoid too much text in the background.\"},{\"label\":\"80's Anime\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_80s_anime.jpg?v=3\",\"value\":\"80's Anime\",\"prompt\":\"maintain original composition, facial expressions, and emotion of the original image. completely change the image style into: full illustrated ANIME STYLE: ultra high res video anime illustrated cartoon animated. retro 1980s aesthetic.,very moody lighting. in the style of a low res 1980s anime screengrab. VCR VHS. retro anime screencap. cartoon. CRT scanlines. bloom. halation. heavy film grain. Smooth perfect skin details.\"},{\"label\":\"Sunday Morning\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_sunday_morning.jpg?v=2\",\"value\":\"Sunday Morning\",\"prompt\":\"$84\"}]}],\"textInputs\":[],\"imageInputs\":[{\"id\":\"photo\",\"label\":\"Your photo\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"inputOrder\":[\"photo\",\"style\"],\"promptTemplate\":\"$85\",\"coverImageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_cover.jpg?v=12\",\"coverVerticalImageUrl\":\"https://imagine-public.x.ai/agent-skills/restyle/restyle_vertical.jpg?v=11\",\"coverDimensions\":{\"width\":2592,\"height\":1728},\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-04-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-04-output.jpg?v=20260723\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-09-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-09-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-44-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-44-output.jpg?v=20260723\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/restyle/variants/RST-07-input.jpg?v=20260 cal\"}]}],\"imageInputs\":[{\"id\":\"image\",\"label\":\"Reference image\",\"description\":\"Upload the image to reframe.\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"textInputs\":[],\"inputOrder\":[\"image\",\"targetRatios\"],\"promptTemplate\":\"$86\",\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-12-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-12-output-16x9.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/SRZ-79-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/SRZ-79-output.jpg?v=20260723\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-22-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-22-output-1x1.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-20-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/ADR-20-output-16x9.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/SRZ-78-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/aspect_ratio/variants/SRZ-78-output.jpg?v=20260723\"}]},{\"id\":\"imagine-background-removal\",\"title\":\"BG Removal \u0026 Change\",\"description\":\"Isolate the main subject of any photo with high-fidelity cutout quality, then deliver it on the background you choose: genuine transparent alpha, a clean white studio backdrop, or a custom scene you describe.\",\"category\":\"Photo Tools\",\"coverImageUrl\":\"https://media.x.ai/v1/website/background_removal-3d1e4f48.jpg\",\"coverDimensions\":{\"width\":1728,\"height\":1152},\"coverVerticalImageUrl\":\"https://imagine-public.x.ai/agent-skills/background_removal/background_removal_vertical.jpg?v=7\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image\"},{\"label\":\"Output\",\"value\":\"Transparent PNG · White · Custom scene\"},{\"label\":\"Images\",\"value\":\"1\"}],\"presetInputs\":[{\"id\":\"backgroundMode\",\"label\":\"Background\",\"description\":\"What the subject should sit on after removal. Transparent = a real cutout on true alpha; White background = a clean white studio backdrop; Custom = a new scene you describe below. Defaults to Transparent.\",\"required\":true,\"options\":[{\"label\":\"Transparent\",\"value\":\"transparent\",\"prompt\":\"Transparent — return the subject on a genuine transparent alpha channel (a real PNG with true transparency). No background at all: no white or gray fill, no painted checkerboard, and no added canvas, padding, outline, or drop shadow.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/background_removal/bg-transparent.jpg?v=1\"},{\"label\":\"White background\",\"value\":\"white\",\"prompt\":\"White background — place the cut-out subject on a clean, uniform pure-white (#FFFFFF) studio background: evenly lit, no gradient, texture, vignette, or props. A subtle natural contact shadow directly under the subject is acceptable. Return an opaque image.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/background_removal/bg-white.jpg?v=1\"},{\"label\":\"Custom\",\"value\":\"custom\",\"prompt\":\"Custom background — remove the original background and place the subject, unchanged, onto the new background described under 'New background'. Recreate that scene photorealistically behind the subject and integrate it naturally — match perspective, scale, lighting direction, and color temperature, and add a grounded contact shadow or reflection as the scene calls for — while keeping the subject itself pixel-faithful.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/background_removal/bg-custom.jpg?v=1\"}]}],\"imageInputs\":[{\"id\":\"sourceImage\",\"label\":\"Image to cut out\",\"description\":\"The photo whose main subject should be isolated.\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"textInputs\":[{\"id\":\"customBackground\",\"label\":\"New background\",\"description\":\"Only for Custom: describe the scene the subject should be placed on (e.g. 'a rainy neon-lit city street at night' or 'a white marble kitchen counter in soft window light').\",\"required\":false,\"multiline\":true,\"placeholder\":\"Describe the new background scene (Custom mode only)\"},{\"id\":\"notes\",\"label\":\"Notes (optional)\",\"required\":false,\"placeholder\":\"Optional: anything specific you want\"}],\"inputOrder\":[\"backgroundMode\",\"sourceImage\",\"customBackground\",\"notes\"],\"promptTemplate\":\"$87\",\"variants\":[]},{\"id\":\"imagine-ecommerce-listing\",\"title\":\"E-Commerce Photos\",\"description\":\"Turn one product photo into a complete 6-image e-commerce listing set — main on white, benefit infographic, lifestyle, in-use, detail close-up, and true-scale in-hand shot.\",\"category\":\"Marketing\",\"coverImageUrl\":\"https://media.x.ai/v1/website/ecommerce_listing-1951dd37.jpg\",\"coverDimensions\":{\"width\":1408,\"height\":1408},\"coverVerticalImageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/ecommerce_photos/ecommerce_photos_vertical.jpg?v=2\",\"settings\":[{\"label\":\"Aspect\",\"value\":\"1:1\"},{\"label\":\"Output\",\"value\":\"6 images\"}],\"imageInputs\":[{\"id\":\"productPhoto\",\"label\":\"Product photo\",\"description\":\"One clear, well-lit photo of your product — if it has a label, make sure it is readable.\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"textInputs\":[{\"id\":\"benefit1\",\"label\":\"Product benefit 1\",\"description\":\"Short benefit phrases (2–3). These are the ONLY claims that will appear on the images.\",\"required\":true,\"placeholder\":\"e.g., No guilt snack\"},{\"id\":\"benefit2\",\"label\":\"Product benefit 2\",\"required\":true,\"placeholder\":\"e.g., Extra crunchy\"},{\"id\":\"benefit3\",\"label\":\"Product benefit 3 (optional)\",\"required\":false,\"placeholder\":\"e.g., Sea salt finish\"},{\"id\":\"sizeHint\",\"label\":\"Size hint (optional)\",\"required\":false,\"placeholder\":\"e.g., \\\"about 7 in tall\\\" or \\\"fits in one hand\\\"\"}],\"promptTemplate\":\"$88\",\"inputOrder\":[\"productPhoto\",\"benefit1\",\"benefit2\",\"benefit3\",\"sizeHint\"],\"variants\":[]},{\"id\":\"imagine-collage\",\"title\":\"Photo Collage\",\"description\":\"Combine 2-16 of your photos into tasteful, shareable collages — pick one or more styles (one collage per style): pure grid, torn paper, bento cards, travel journal, or photo-booth strip.\",\"category\":\"Photo Tools\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image\"},{\"label\":\"Images\",\"value\":\"2-16\"},{\"label\":\"Orientation\",\"value\":\"Landscape / Portrait\"}],\"presetInputs\":[{\"id\":\"style\",\"label\":\"Styles\",\"description\":\"Pick one or more styles — you get one collage per selected style.\",\"required\":true,\"multiSelect\":true,\"options\":[{\"label\":\"Pure grid\",\"value\":\"pure-grid\",\"prompt\":\"a clean photo grid that ALWAYS fills the entire canvas, using exactly this partition for the photo count: 2 photos = two full-height side-by-side columns; 3 = one large cell filling the left two-thirds plus the other two photos stacked on the right third; 4 = a 2x2 grid; 5 = a top row of two cells over a bottom row of three; 6 = a 3x2 grid; more photos = the most balanced near-square grid. Cover-crop every photo INTO its cell so the cell is completely filled edge to edge — a photo never floats inside a cell; straight uniform white gutters (about 2% of the canvas) with the same slim outer border; zero slack canvas — no white area larger than a gutter anywhere; keep every photo's original colors exactly (no black-and-white conversion, no regrading); no frames, no tilting, no overlapping, no decoration — the grid IS the image\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/style_pure_grid.jpg?v=4\"},{\"label\":\"Torn paper\",\"value\":\"torn-paper\",\"prompt\":\"each photo torn along irregular white ripped-paper edges, the torn pieces layered and overlapping on a warm kraft-beige paper backdrop with soft drop shadows — handmade, tactile, imperfect by design\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/style_torn_paper.jpg?v=7\"},{\"label\":\"Bento cards\",\"value\":\"bento-cards\",\"prompt\":\"the photos in rounded-corner cards of deliberately varied sizes packed into a neat bento grid with even padding on a soft off-white background, subtle card shadows — modern app aesthetic, clean and friendly\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/style_bento.jpg?v=6\"},{\"label\":\"Travel journal\",\"value\":\"travel-journal\",\"prompt\":\"an open travel-journal spread: the photos taped over a faint vintage map, a dotted route line wandering between them, a compass stamp and ticket-stub ephemera in the corners — short generic handwritten-style captions are part of this style and allowed\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/style_travel_journal.jpg?v=7\"},{\"label\":\"Photo-booth strip\",\"value\":\"photo-booth-strip\",\"prompt\":\"one pristine vertical photo-booth strip filling the canvas height, shot perfectly straight and flat-on (no tilt, no perspective): exactly one equal frame per photo stacked inside the strip with even white borders, and EVERY frame completely filled by its photo — cover-crop each photo into its frame edge to edge, a photo never floats small inside a frame; crisp print quality, plain warm off-white background, barely-there soft shadow — iconic, symmetrical, clean\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/style_booth_strip.jpg?v=8\"}]}],\"aspectInputs\":[{\"id\":\"orientation\",\"label\":\"Orientation\",\"description\":\"Landscape or portrait — the whole collage is composed to fill that canvas shape.\",\"required\":true,\"options\":[{\"value\":\"2:3\",\"name\":\"Portrait\",\"prompt\":\"a PORTRAIT canvas with a 2:3 vertical aspect ratio (clearly taller than wide) — lay the whole collage out to FILL this tall canvas edge to edge, adapting the cell arrangement, proportions and gutters to the vertical format (favor taller stacks); never letterbox, pad or leave the canvas partly empty\"},{\"value\":\"3:2\",\"name\":\"Landscape\",\"prompt\":\"a LANDSCAPE canvas with a 3:2 horizontal aspect ratio (clearly wider than tall) — lay the whole collage out to FILL this wide canvas edge to edge, adapting the cell arrangement, proportions and gutters to the horizontal format (favor wider rows); never letterbox, pad or leave the canvas partly empty\"}]}],\"textInputs\":[{\"id\":\"notes\",\"label\":\"Notes (optional)\",\"required\":false,\"placeholder\":\"Optional: anything specific you want\"}],\"imageInputs\":[{\"id\":\"photos\",\"label\":\"Your photos\",\"description\":\"2 to 16 photos to combine — every photo you attach will appear in the collage exactly once.\",\"required\":true,\"minImages\":2,\"maxImages\":16}],\"inputOrder\":[\"photos\",\"style\",\"orientation\"],\"promptTemplate\":\"$89\",\"coverImageUrl\":\"https://media.x.ai/v1/website/collage-3896a502.jpg\",\"coverDimensions\":{\"width\":1408,\"height\":1408},\"coverVerticalImageUrl\":\"https://imagine-public.x.ai/agent-skills/collage/collage_vertical.jpg?v=10\",\"variants\":[{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/collage/variants/designer-bento-2x3.jpg\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/collage/variants/designer-travel-journal-2x3.jpg?v=20260723\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/collage/variants/designer-pure-grid-2x3.jpg?v=20260723\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/collage/variants/designer-photo-booth-2x3.jpg\"}]},{\"id\":\"imagine-profile-picture\",\"title\":\"Profile Picture\",\"description\":\"Turn a casual photo into a standout social or dating profile picture — authentic-looking, lik ent-skills/living_sprite/motion_jump.png?v=1\"},{\"label\":\"Attack\",\"value\":\"attack\",\"prompt\":\"attack — a weapon-appropriate strike with anticipation, a snappy hit, and follow-through\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/living_sprite/motion_attack.png?v=1\"},{\"label\":\"Hurt\",\"value\":\"hurt\",\"prompt\":\"hurt — a quick recoil\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/living_sprite/motion_hurt.png?v=1\"}]},{\"id\":\"background\",\"label\":\"Background\",\"description\":\"Transparent by default. Pick a solid keying backdrop only if you want extra-clean cutouts.\",\"default\":\"none\",\"options\":[{\"label\":\"Transparent (default)\",\"value\":\"none\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/living_sprite/bg_none.png?v=1\"},{\"label\":\"Chroma key\",\"value\":\"chroma-key\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/living_sprite/bg_chroma_key.png?v=1\"}]}],\"imageInputs\":[{\"id\":\"reference\",\"label\":\"Reference image (optional)\",\"description\":\"Animate an existing character image instead of generating one - it is matched exactly, not restyled.\",\"required\":false,\"minImages\":0,\"maxImages\":1}],\"textInputs\":[{\"id\":\"character\",\"label\":\"Character\",\"required\":true,\"multiline\":true,\"placeholder\":\"Describe your character and its weapon, e.g. \\\"an orc barbarian with a two-handed axe\\\" or \\\"a hooded elf archer with a longbow\\\".\",\"example\":\"a knight in silver armor with a sword and shield\"},{\"id\":\"notes\",\"label\":\"Notes (optional)\",\"required\":false,\"placeholder\":\"Anything specific: art style, palette, facing direction, effect color, cell size.\"}],\"inputOrder\":[\"character\",\"motion\",\"background\",\"frames\",\"reference\",\"notes\"],\"promptTemplate\":\"$8e\",\"variants\":[]},{\"id\":\"imagine-emoji-creator\",\"title\":\"Emoji Creator\",\"description\":\"Turn a photo of your face, pet, or mascot into a matching pack of Twitch/Discord emotes — pick an emote pack and an art style; same subject in every emote, readable at chat size.\",\"category\":\"Streaming\",\"coverImageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/emoji_creator_cover.jpg?v=12\",\"coverVerticalImageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/emoji_creator_vertical.jpg?v=12\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image\"},{\"label\":\"Output\",\"value\":\"Transparent PNGs\"},{\"label\":\"Sizes\",\"value\":\"112px+ square\"}],\"presetInputs\":[{\"id\":\"pack\",\"label\":\"Emote pack\",\"required\":true,\"options\":[{\"label\":\"Expressions\",\"value\":\"expressions\",\"prompt\":\"EXPRESSIONS PACK - the core reaction set, 6 emotes:\\nLUL - laughing hard: eyes squeezed shut, huge wide-open grin, head tilted back\\nPOG - amazed excitement: jaw dropped wide open, giant round eyes, eyebrows sky-high\\nCRY - bawling: huge welling puppy eyes with big glossy tear drops streaming down\\nLOVE - adoring: big heart-shaped eyes and a blissful smile, small floating hearts\\nSAD - dejected pout: downturned mouth, droopy brows, big glossy eyes on the verge of tears\\nHYPE - pumped celebration: ecstatic open-mouth cheer with confetti or sparks around the head\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/pack_expressions.jpg?v=2\"},{\"label\":\"Gaming\",\"value\":\"gaming\",\"prompt\":\"GAMING PACK - the competitive-stream set, 6 emotes:\\nPOG - amazed excitement: jaw dropped wide open, giant round eyes, eyebrows sky-high\\nGG - good game: cheerful confident grin with a thumbs-up, plus the bold letters GG in thick readable type\\nRAGE - furious tilt: red-flushed face, brow slammed down, gritted teeth, a popping anger vein\\nLURK - peeking: ONLY the eyes and the top of the head visible, rising from the BOTTOM EDGE of the frame - no mouth, no body, nothing else\\nW - the win: triumphant grin next to a single huge bold letter W in thick readable type\\nL - the loss: stunned comic deadpan face next to a single huge bold letter L in thick readable type\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/pack_gaming.jpg?v=2\"},{\"label\":\"Love \u0026 Hype\",\"value\":\"love-hype\",\"prompt\":\"LOVE \u0026 HYPE PACK - the celebration and support set (raids, subs, big moments), 6 emotes:\\nLOVE - adoring: big heart-shaped eyes and a blissful smile, small floating hearts\\nKISS - blowing a kiss: puckered lips with one small heart floating away from them\\nHUG - warm embrace: both arms stretched wide open toward the viewer, beaming smile\\nCLAP - applause: two oversized hands clapping in front of a delighted face, motion sparks\\nPARTY - celebration: tiny party hat, confetti bursting around a joyful open-mouth cheer\\nDANCE - vibing: eyes closed in bliss, head tilted mid-groove, music notes floating around\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/pack_lovehype.jpg?v=2\"},{\"label\":\"Meme Classics\",\"value\":\"meme-classics\",\"prompt\":\"MEME CLASSICS PACK - original takes on chat-culture staple reactions (no third-party characters, the SUBJECT performs each meme), 6 emotes:\\nKEKW - unhinged wheeze-laugh: head thrown back, mouth impossibly wide, tears of laughter flying\\nMONKA - nervous stare: huge frozen wide eyes looking sideways, one giant bead of sweat on the forehead\\nSADGE - deflated: shoulders slumped, flat defeated mouth, big dull downcast eyes\\nCOPE - denial: strained trembling forced smile, one twitching eye, a single tear, everything-is-fine energy\\nJAM - vibing to music: eyes shut tight in bliss, head mid-bob, oversized headphones, music notes around\\nNOTLIKETHIS - despair: both hands clasped on top of the head, mouth open in a silent scream, eyes to the sky\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/pack_meme.jpg?v=2\"},{\"label\":\"Custom\",\"value\":\"custom\",\"prompt\":\"CUSTOM PACK: create exactly the expressions listed under 'Extra notes' below - one emote per listed item, following each item's description literally\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/pack_custom.jpg?v=2\"}]},{\"id\":\"style\",\"label\":\"Style\",\"required\":true,\"options\":[{\"label\":\"Chibi cartoon\",\"value\":\"chibi\",\"prompt\":\"chibi cartoon style: oversized head, tiny or no body, bold clean dark outlines, flat cel shading, bright saturated colors\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/style_chibi.jpg?v=3\"},{\"label\":\"Kawaii pastel\",\"value\":\"kawaii\",\"prompt\":\"kawaii pastel style: extra-round simplified shapes, soft pastel palette with high contrast between them, big sparkly eyes, rosy blush circles on the cheeks, tiny sparkle accents, clean bold outlines\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/style_kawaii.jpg?v=3\"},{\"label\":\"Pixel art\",\"value\":\"pixel\",\"prompt\":\"TRUE RETRO PIXEL ART - mandatory rendering rules, not a mood: draw the emote as if on a tiny 48x48 pixel grid and then enlarged, so the whole image is built from big, visible, hard-edged SQUARE pixels; every contour stair-steps - no smooth curves, no anti-aliasing, no gradients, no soft or painterly shading anywhere; a flat limited palette of roughly 16 solid colors, with at most simple two-tone dithering for shade; it must look like a video-game sprite from a 1990s console. If any part of the image looks like a smooth cartoon, the style is wrong\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/style_pixel.jpg?v=3\"},{\"label\":\"Flat sticker\",\"value\":\"sticker\",\"prompt\":\"flat die-cut sticker style: completely FLAT vector artwork - solid one-tone color fills only, zero gradients, zero shading, zero highlights, zero texture; simple bold geometric shapes with clean dark outlines; and the signature feature: a THICK solid-white die-cut sticker border of uniform width tracing the entire outer silhouette, like a sticker just peeled off its sheet - the white border must be clearly visible around the whole emote\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/style_sticker.jpg?v=3\"},{\"label\":\"3D clay\",\"value\":\"clay\",\"prompt\":\"3D claymation style: the subject sculpted from real matte plasticine like a stop-motion movie character - chunky hand-molded rounded forms with softly uneven surfaces, visible fingerprint smudges and subtle sculpting-tool marks in the clay; photographed with soft dimensional studio lighting that gives real depth and soft shadows; it must read as a photo of a physical clay figurine - never a flat drawing, never a smooth glossy 3D render\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/style_clay.jpg?v=3\"}]}],\"textInputs\":[{\"id\":\"notes\",\"label\":\"Notes (optional — required for the Custom pack)\",\"required\":false,\"multiline\":true,\"placeholder\":\"Anything specific you want. For the Custom pack, list your expressions here, one per line, e.g.:\\nSIP - smug sideways glance while sipping from a tiny mug\\nBONK - eyes shut tight, comic bonk with a paper fan overhead\"}],\"imageInputs\":[{\"id\":\"subjectImage\",\"label\":\"Your face, pet, or mascot\",\"description\":\"One clear photo of the subject the emotes should be based on — a face, a pet, or a mascot/logo character.\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"inputOrder\":[\"subjectImage\",\"pack\",\"style\",\"notes\"],\"promptTemplate\":\"$8f\",\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-01-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-01-output.jpg?v=20260723\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-04-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-04-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-11-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-11-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-37-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-37-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-40-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/emoji_creator/variants/EMC-40-output.jpg?v=20260723\"}]},{\"id\":\"imagine-ugc-photos\",\"title\":\"UGC Photos\",\"description\":\"Turn product reference photos into 6 authentic UGC-style phone snapshots, each with a different person and setting.\",\"category\":\"Marketing\",\"coverImageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/ugc_image/Inluencer%201_16x9.png?v=3\",\"coverVerticalImageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/ugc_image/Influencer%201_2x3.jpg?v=1\",\"settings\":[{\"label\":\"Aspect\",\"value\":\"9:16\"}],\"imageInputs\":[{\"id\":\"product\",\"label\":\"Product photos\",\"description\":\"Multi-angle photos of the product — more angles, more accuracy.\",\"required\":true,\"minImages\":1,\"maxImages\":8}],\"presetInputs\":[{\"id\":\"size\",\"label\":\"Product size\",\"description\":\"How big is the product in real life? Pick the closest — it sets how large the product is rendered relative to hands, faces and furniture. Choose one.\",\"required\":true,\"options\":[{\"label\":\"Pocket-size\",\"value\":\"Pocket-size\",\"prompt\":\"Pocket-size — small enough that a closed hand mostly hides it; fingers wrap all the way around it and it slips into a pocket (a lip balm, a ring box, an earbuds case, a keychain trinket). Render it this small; never enlarge it to show detail.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/ugc_photos/ugc-size-1-pocket.png?v=2\"},{\"label\":\"Handheld\",\"value\":\"Handheld\",\"prompt\":\"Handheld — sits in one open palm and is gripped in a single hand without being fully enclosed; roughly palm-to-forearm length (a smartphone, a soda can, a serum bottle, a coffee mug, a TV remote).\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/ugc_photos/ugc-size-2-handheld.png?v=2\"},{\"label\":\"Medium\",\"value\":\"Medium\",\"prompt\":\"Medium — too big for one hand to enclose; naturally held with two hands or cradled against a forearm, noticeably larger than a single palm (a kettle, a boot, a plush toy, a shoebox, a table lamp).\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/ugc_photos/ugc-size-3-medium.png?v=2\"},{\"label\":\"Large\",\"value\":\"Large\",\"prompt\":\"Large — clearly dwarfs the hand; carried against the body or set on the floor or a table rather than held up to the camera (a backpack, a small appliance, a duffel bag, a floor cushion).\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/ugc_photos/ugc-size-4-large.png?v=2\"},{\"label\":\"Oversized\",\"value\":\"Oversized\",\"prompt\":\"Oversized — furniture- or appliance-scale; a person stands beside, holds a corner of, or leans on it and a hand covers only a small fraction of its surface (an armchair, a suitcase, a large monitor, a piece of luggage).\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/ugc_photos/ugc-size-5-oversized.png?v=2\"}]}],\"textInputs\":[{\"id\":\"custom_size\",\"label\":\"Exact size (optional)\",\"required\":false,\"placeholder\":\"e.g. 12 oz can, ~15 cm tall; or 'fits in a palm'\"},{\"id\":\"vibe\",\"label\":\"Brand vibe (optional)\",\"required\":false,\"placeholder\":\"e.g. cozy morning routine, gym bag essential\"}],\"inputOrder\":[\"product\",\"size\",\"custom_size\",\"vibe\"],\"promptTemplate\":\"$90\",\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-18-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-18-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-19-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-19-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-37-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-37-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-15-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-15-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-21-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/ugc_image/variants/UGC-21-output.jpg?v=20260723\"}]},{\"id\":\"imagine-mascot-maker\",\"title\":\"Mascot Maker\",\"description\":\"Turn a one-line concept into an original, production-ready game mascot: one full-body character with a strong iconic silhouette, a memorable color identity, and tons of personality — centered on a keyable (transparent) background, sprite-base ready. Pairs naturally with Character Sprite Maker to animate your mascot into engine-ready sprite sheets.\",\"category\":\"Design Tools\",\"coverImageUrl\":\"https://media.x.ai/v1/website/mascot_maker-7c132cc8.jpg\",\"coverDimensions\":{\"width\":1408,\"height\":1408},\"coverVerticalImageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/mascot_maker_vertical.jpg?v=3\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image\"},{\"label\":\"Options\",\"value\":\"1\"},{\"label\":\"Images\",\"value\":\"0\"}],\"presetInputs\":[{\"id\":\"art_style\",\"label\":\"Style\",\"description\":\"The art style for your mascot. Leave unset for the polished 2D game-mascot look.\",\"default\":\"game-mascot\",\"options\":[{\"label\":\"Polished 2D game mascot\",\"value\":\"game-mascot\",\"prompt\":\"game-mascot: polished 2D game mascot art — bold clean dark outlines, vibrant saturated colors, soft cel shading, chunky readable shapes, big expressive eyes, high contrast, crisp edges, no photorealism.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_game_mascot.jpg?v=3\"},{\"label\":\"Chibi cute\",\"value\":\"chibi\",\"prompt\":\"chibi: cute chibi proportions — oversized head, tiny body, maximum charm.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_chibi.jpg?v=3\"},{\"label\":\"Retro cartoon\",\"value\":\"retro-cartoon\",\"prompt\":\"retro-cartoon: rubber-hose / classic-cartoon energy, bold and bouncy.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_retro_cartoon.jpg?v=3\"},{\"label\":\"Flat vector\",\"value\":\"flat-vector\",\"prompt\":\"flat-vector: clean flat vector shapes, minimal shading, mascot-logo ready.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_flat_vector.jpg?v=3\"},{\"label\":\"Painterly\",\"value\":\"painterly\",\"prompt\":\"painterly: rich hand-painted illustration with soft rendered volume.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_painterly.jpg?v=3\"},{\"label\":\"Pixel art\",\"value\":\"pixel\",\"prompt\":\"pixel: true chunky pixel art, hard stair-stepped edges, a limited palette, no anti-aliasing.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/style_pixel.jpg?v=3\"}]},{\"id\":\"background\",\"label\":\"Background\",\"description\":\"What sits behind the mascot. Transparent (keyable) by default so it drops straight into a game or Character Sprite Maker.\",\"default\":\"transparent\",\"options\":[{\"label\":\"Transparent\",\"value\":\"transparent\",\"prompt\":\"transparent: deliver the mascot as a clean cutout on a fully transparent background (alpha), edges tight, ready to composite.\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/bg_transparent.png?v=1\"},{\"label\":\"Chroma key\",\"value\":\"chroma-magenta\",\"prompt\":\"chroma-magenta: a solid flat chroma-key magenta (#FF00FF) fill for easy keying (use solid green if the character itself is magenta).\",\"imageUrl\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/bg_chroma_magenta.png?v=1\"}]}],\"imageInputs\":[],\"textInputs\":[{\"id\":\"concept\",\"label\":\"Mascot concept\",\"required\":true,\"multiline\":true,\"placeholder\":\"The character in a line, e.g. \\\"a punk shark in a leather jacket\\\" or \\\"a tiny mushroom knight\\\".\",\"example\":\"a punk shark in a leather jacket\"},{\"id\":\"color_palette\",\"label\":\"Color palette (optional)\",\"required\":false,\"placeholder\":\"Optional: dominant colors, e.g. \\\"electric blue + storm grey + yellow\\\".\"},{\"id\":\"notes\",\"label\":\"Notes (optional)\",\"required\":false,\"placeholder\":\"Anything specific: a signature pose, an accessory, a vibe.\"}],\"inputOrder\":[\"concept\",\"art_style\",\"color_palette\",\"background\",\"notes\"],\"promptTemplate\":\"$91\",\"variants\":[{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/variants/MSC-01-output.jpg\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/variants/MSC-11-output.jpg\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/variants/MSC-25-output.jpg\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/variants/MSC-50-output.jpg\"},{\"inputs\":null,\"output\":\"https://imagine-public.x.ai/agent-skills/mascot_maker/variants/MSC-17-output.jpg\"}]},{\"id\":\"imagine-editorial-poster\",\"title\":\"Editorial Product Poster\",\"description\":\"Turn a single product photo into an art-directed, editorial typographic poster.\",\"category\":\"Marketing\",\"coverImageUrl\":\"https://media.x.ai/v1/website/editorial_poster-98f28252.jpg\",\"coverDimensions\":{\"width\":1408,\"height\":1408},\"coverVerticalImageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/editorial/editorial_veritcal.jpg\",\"settings\":[{\"label\":\"Aspect\",\"value\":\"9:16\"}],\"presetInputs\":[{\"id\":\"mode\",\"label\":\"Mode\",\"required\":true,\"options\":[{\"label\":\"Maximal\",\"value\":\"MAXIMAL\",\"imageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/editorial/maximal_editorial.jpg?v=2\",\"prompt\":\"MAXIMAL (layered, maximalist — equivalent to \\\"Prompt 1\\\")\\n- Signature move: TEXT-BEHIND-PRODUCT OVERLAP. Blow the hero word up huge and layer the product in front\\n  of it so they overlap — this is what creates depth. The hero word MAY be repeated, stacked, or ghosted\\n  behind the product (e.g. a stacked wordmark, a ghosted echo) when it elevates the piece.\\n- Staging is either SURREAL scale-play (product placed in an unexpected oversized/world context to stop the\\n  scroll) OR surgically clean (product floating in near-empty space). No timid middle ground.\\n- Lean into richness within the single color world: full tonal commitment, confident bold+script pairing.\"},{\"label\":\"Minimal\",\"value\":\"MINIMAL\",\"imageUrl\":\"https://storage.googleapis.com/imagine-public.x.ai/agent-skills/editorial/minimal_editorial.jpg?v=2\",\"prompt\":\"MINIMAL (disciplined, single-archetype — equivalent to \\\"Prompt 2\\\")\\nPick the ONE composition archetype that best fits this product:\\n  1. Single hero word overlapping the product (default).\\n  2. Hero word split in two around the product (top-left / bottom-right).\\n  3. Script word + bold display word paired (e.g. \\\"tasty\\\" over \\\"MORNING\\\").\\n  4. Clean minimal: small hero word, product centered, lots of empty space.\\n  5. Color-flooded: badge + headline + product + CTA on one centered axis.\\n\\nAVOID (critical):\\n- Do NOT repeat or stack the same word. State the hero word ONCE. Do not tile or echo the brand name to fill\\n  the background. (A single faint ghost behind the product is allowed only rarely — assume NOT for this poster\\n  unless it clearly elevates it.)\\n- No more than three type families. No rainbow of color. No mid-sized filler text. No busy backgrounds or clip-art.\\n- Staging: surgically clean (product floating in calm space) OR one surreal scale-play idea — nothing in between.\"}]}],\"imageInputs\":[{\"id\":\"product\",\"label\":\"Product image\",\"required\":true,\"minImages\":1,\"maxImages\":1}],\"textInputs\":[{\"id\":\"hero\",\"label\":\"Hero\",\"required\":true,\"placeholder\":\"e.g. RADIANCE\"},{\"id\":\"subhead\",\"label\":\"Subtext\",\"required\":true,\"placeholder\":\"e.g. Vitamin C brightening serum\"},{\"id\":\"labels\",\"label\":\"Fine prints (3-5 words)\",\"placeholder\":\"e.g. VEGAN, CRUELTY-FREE, 30ML\"}],\"promptTemplate\":\"$92\",\"variants\":[{\"inputs\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-01-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-01-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-44-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-44-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-16-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-16-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-13-input.jpg?v=20260723\",\"output\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-13-output.jpg\"},{\"inputs\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-28-input.jpg\",\"output\":\"https://imagine-public.x.ai/agent-skills/editorial/variants/EDP-28-output.jpg\"}]},{\"id\":\"imagine-professional-headshot\",\"title\":\"Professional Headshot\",\"description\":\"Turn any casual photo into a LinkedIn-grade professional headshot — unmistakably the same person, with professionalized attire, backdrop, and lighting.\",\"category\":\"Photo Tools\",\"settings\":[{\"label\":\"Mode\",\"value\":\"Image\"},{\"label\
