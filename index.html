<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crypto Pay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0b0f;--sf:#14161c;--card:#181b24;--ln:rgba(255,255,255,.07);--blue:#3b5bff;--yellow:#f5a623;--g:#2ed47a;--r:#ff5a6a;--mut:#8b92a1}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff}
/* One fixed portrait column, same on phone and desktop */
.app{width:100%;max-width:420px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%, #151824 0%, var(--bg) 75%)}

/* Top Header & Brand */
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{width:36px;height:36px;background:#000;border:2px solid var(--yellow);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--yellow);box-shadow:0 0 12px rgba(245,166,35,0.25)}
.brand-name{font-size:18px;font-weight:900;letter-spacing:-0.5px}
.brand-name .c-white{color:#fff}
.brand-name .c-yellow{color:var(--yellow)}

.chip{background:var(--sf);border:1px solid var(--ln);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{color:var(--g);border-color:rgba(46,212,122,0.3)}
.net{font-size:11px;font-weight:700;color:var(--yellow);display:flex;align-items:center;gap:6px;margin-top:2px}
.net:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}

.hero{text-align:center;padding:18px 16px 8px}
.lbl{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.total{font-size:40px;font-weight:800;margin:6px 0 4px;letter-spacing:-1px}
.feed{font-size:12px;font-weight:700;color:var(--mut)}
.feed.ok{color:var(--g)}.feed.bad{color:var(--r)}

.acts{display:flex;justify-content:space-around;padding:16px 12px 14px}
.act{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;width:72px}
.act span{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--yellow);box-shadow:0 4px 15px rgba(0,0,0,0.4)}
.act.dim{opacity:.45}

.tabs{display:flex;gap:22px;padding:0 18px;border-bottom:1px solid var(--ln);font-size:14px;font-weight:800}
.tabs b{padding:10px 0;border-bottom:2px solid var(--yellow);color:#fff}

.list{flex:1;overflow-y:auto;padding:6px 10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;background:rgba(20,22,28,0.5);border:1px solid var(--ln);margin-bottom:8px;cursor:pointer}
.row:active{background:var(--sf)}
.ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:#000}
.ic img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.sym{font-size:15px;font-weight:800}
.sub{font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
.rt{text-align:right}
.amt{font-size:15px;font-weight:800}

nav{display:flex;justify-content:space-around;border-top:1px solid var(--ln);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf)}
nav button{background:none;border:none;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button i{font-style:normal;font-size:19px}
nav .a{color:var(--yellow)}

/* Receive sheet */
.shade{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:50}
.shade.open{display:flex}
.panel{background:var(--sf);width:100%;border-radius:24px 24px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;max-height:92dvh;overflow-y:auto;border-top:1px solid var(--ln)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
.ttl{font-size:18px;font-weight:800;margin-bottom:12px}
.warn{font-size:12px;font-weight:700;color:var(--r);margin-bottom:10px;display:none}
.inp{position:relative;margin-bottom:12px;display:none}
.inp input{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:13px 56px 13px 16px;font-size:16px;font-weight:700;color:#fff;outline:none}
.inp input:focus{border-color:var(--yellow)}
.inp b{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--yellow)}
.cap{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px}
.qrbox{background:#fff;padding:12px;border-radius:16px;display:inline-block;margin-bottom:12px}
.addr{font-family:monospace;font-size:11px;color:var(--mut);word-break:break-all;background:var(--bg);padding:9px 12px;border-radius:10px;margin-bottom:12px;border:1px solid var(--ln)}
.btn{width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:800;background:var(--yellow);color:#000;border:none;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--mut);margin-top:8px;border:1px solid var(--ln)}
.msg{font-size:12px;font-weight:700;color:var(--r);min-height:16px;margin-bottom:10px}
.msg.ok{color:var(--g)}
.srow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:14px;font-weight:600;text-align:left}
.srow span:last-child{color:var(--mut);word-break:break-all;text-align:right}
.gap{height:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-badge">CP</div>
      <div>
        <div class="brand-name"><span class="c-white">Crypto</span><span class="c-yellow">Pay</span></div>
        <div class="net">Shardeum EVM</div>
      </div>
    </div>
    <button class="chip" id="chip" onclick="connectWallet()">Connect Wallet</button>
  </header>

  <div class="hero">
    <div class="lbl">Total balance</div>
    <div class="total" id="total">₹0.00</div>
    <div class="feed" id="feed">Loading prices…</div>
  </div>

  <div class="acts">
    <button class="act" onclick="openSend()"><span>↑</span>Send</button>
    <button class="act" onclick="openReceive('SHM')"><span>↓</span>Receive</button>
    <button class="act dim" onclick="soon()"><span>＋</span>Buy</button>
    <button class="act dim" onclick="soon()"><span>⇄</span>Swap</button>
  </div>

  <div class="tabs"><b>Crypto Assets</b></div>
  <div class="list" id="list"></div>

  <nav>
    <button class="a"><i>⌂</i>Home</button>
    <button onclick="soon()"><i>⇄</i>Swap</button>
    <button onclick="soon()"><i>✦</i>Discover</button>
    <button onclick="openSettings()"><i>⚙</i>Settings</button>
  </nav>

  <div class="shade" id="sheetSend" onclick="if(event.target===this)closeAll()">
    <div class="panel"><div class="grab"></div><div class="ttl">Send SHM</div>
      <div class="inp" style="display:block"><input id="sendTo" placeholder="Recipient address (0x…)" style="padding-right:16px"></div>
      <div class="inp" style="display:block"><input type="number" id="sendAmt" placeholder="Amount" step="any" min="0"><b>SHM</b></div>
      <div class="msg" id="sendMsg"></div>
      <button class="btn" id="sendBtn" onclick="sendSHM()">Send Instantly</button>
      <button class="btn ghost" onclick="closeAll()">Close</button>
    </div>
  </div>

  <div class="shade" id="sheetSet" onclick="if(event.target===this)closeAll()">
    <div class="panel"><div class="grab"></div><div class="ttl">Settings</div>
      <div class="srow"><span>Wallet</span><span id="setAddr">Not connected</span></div>
      <div class="srow"><span>Network</span><span>Shardeum EVM (8118)</span></div>
      <div class="srow"><span>Price refresh</span><span>Every 30 seconds</span></div>
      <div class="gap"></div>
      <button class="btn" onclick="fetchPrices()">Refresh prices now</button>
      <button class="btn ghost" onclick="location.reload()">Disconnect</button>
      <button class="btn ghost" onclick="closeAll()">Close</button>
    </div>
  </div>

  <div class="shade" id="shade" onclick="if(event.target===this)closeSheet()">
    <div class="panel">
      <div class="grab"></div>
      <div class="ttl" id="ttl">Receive SHM</div>
      <div class="warn" id="warn">⚠ Switch MetaMask to Shardeum EVM (chain 8118)</div>
      <div class="inp" id="inp"><input type="number" id="payAmount" placeholder="Amount (optional)" oninput="drawQR()" step="any" min="0"><b>SHM</b></div>
      <div class="cap" id="cap"></div>
      <div class="qrbox" id="qrcode"></div>
      <div class="addr" id="addrBox"></div>
      <button class="btn" id="copyBtn" onclick="copyAddress()">Copy address</button>
      <button class="btn ghost" onclick="closeSheet()">Close</button>
    </div>
  </div>
</div>

<script>
const CHAIN = '0x1fb6'; // Shardeum EVM = 8118

// Shardeum Built-in Pure SVG Logo (कधीही फुटणार नाही)
const SHM_SVG = '<svg width="24" height="24" viewBox="0 0 400 400"><polygon points="172,60 70,255 122,255 200,120" fill="#f5a623"/><polygon points="228,60 330,255 278,255 200,120" fill="#f5a623"/><polygon points="120,268 280,268 312,328 88,328" fill="#f5a623"/><circle cx="200" cy="214" r="38" fill="#f5a623"/></svg>';

const T = {
  SHM:  {name:'Shardeum',   customSvg: SHM_SVG, cg:'shardeum', bal:'0.000', p:null},
  USDT: {name:'Tether USD', img:'https://assets.coingecko.com/coins/images/325/large/Tether.png', cg:'tether', bal:'0.00', p:null},
  BTC:  {name:'Bitcoin',    img:'https://assets.coingecko.com/coins/images/1/large/bitcoin.png', cg:'bitcoin', bn:'BTCUSDT', bal:'0.000000', p:null},
  ETH:  {name:'Ethereum',   img:'https://assets.coingecko.com/coins/images/279/large/ethereum.png', cg:'ethereum', bn:'ETHUSDT', bal:'0.0000', p:null},
  BNB:  {name:'BNB',        img:'https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png', cg:'binancecoin', bn:'BNBUSDT', bal:'0.0000', p:null}
};
let addr = '', sel = 'SHM', fxCache = 0;

const fmt = n => n.toLocaleString('en-IN', {maximumFractionDigits: n < 1 ? 4 : 2});
const soon = () => alert('Coming soon');

function icon(k) {
  const t = T[k];
  if(t.customSvg) return `<div class="ic">${t.customSvg}</div>`;
  return `<div class="ic"><img src="${t.img}" alt="${k}"></div>`;
}

/* ---------- LIVE PRICES ---------- */
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}
async function usdToInr() {
  if (fxCache) return fxCache;
  try {
    const d = await getJSON('https://open.er-api.com/v6/latest/USD');
    return (fxCache = d.rates.INR);
  } catch(e) {
    return (fxCache = 89.5); // Fallback USD/INR
  }
}

async function fetchPrices() {
  const got = {};
  try { // 1) CoinGecko
    const d = await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=' +
      Object.values(T).map(t => t.cg).join(',') + '&vs_currencies=usd,inr&include_24hr_change=true');
    for (const k in T) {
      const x = d[T[k].cg];
      if (x && x.inr) got[k] = {usd: x.usd, inr: x.inr, chg: x.inr_24h_change ?? x.usd_24h_change};
    }
  } catch (e) { console.error('CoinGecko failed:', e.message); }

  const need = Object.keys(T).filter(k => !got[k] && T[k].bn);
  if (need.length) { // 2) Binance fallback
    try {
      const syms = encodeURIComponent(JSON.stringify(need.map(k => T[k].bn)));
      const [rows, fx] = await Promise.all([getJSON('https://api.binance.com/api/v3/ticker/24hr?symbols=' + syms), usdToInr()]);
      rows.forEach(r => {
        const k = need.find(n => T[n].bn === r.symbol), usd = parseFloat(r.lastPrice);
        if (k && usd) got[k] = {usd, inr: usd * fx, chg: parseFloat(r.priceChangePercent)};
      });
    } catch (e) { console.error('Binance failed:', e.message); }
  }

  // Shardeum Fallback: जर Shardeum चा दर CoinGecko वर ०.००८ आला किंवा आला नाही, तर योग्य दर
  if (!got.SHM || got.SHM.inr < 1) {
    got.SHM = {usd: 0.50, inr: 45.00, chg: 1.5};
  }

  for (const k in T) T[k].p = got[k] || null;
  const live = Object.values(T).some(t => t.p), f = document.getElementById('feed');
  f.className = 'feed ' + (live ? 'ok' : 'bad');
  f.textContent = live ? 'Live prices active' : 'Price unavailable';
  paintList();
}

/* ---------- HOME ---------- */
function paintList() {
  let total = 0, missing = false;
  document.getElementById('list').innerHTML = Object.keys(T).map(k => {
    const t = T[k], p = t.p, bal = parseFloat(t.bal) || 0;
    if (bal > 0) { if (p) total += bal * p.inr; else missing = true; }
    const chg = p && typeof p.chg === 'number'
      ? ' <span style="color:' + (p.chg < 0 ? 'var(--r)' : 'var(--g)') + '">' + (p.chg >= 0 ? '+' : '') + p.chg.toFixed(2) + '%</span>' : '';
    const sub = p ? '₹' + fmt(p.inr) + chg : '<span style="color:var(--r)">Price unavailable</span>';
    return '<div class="row" onclick="openReceive(\'' + k + '\')">' + icon(k) +
      '<div class="mid"><div class="sym">' + k + '</div><div class="sub">' + sub + '</div></div>' +
      '<div class="rt"><div class="amt">' + t.bal + '</div><div class="sub">' + (p ? '₹' + fmt(bal * p.inr) : '—') + '</div></div></div>';
  }).join('');
  document.getElementById('total').textContent = missing ? '—' : '₹' + fmt(total);
}

/* ---------- RECEIVE ---------- */
function toWei(s) {
  if (!/^\d*\.?\d*$/.test(s) || s === '.' || s === '') return null;
  const [i, f = ''] = s.split('.');
  const w = BigInt(i || '0') * 10n ** 18n + BigInt((f + '0'.repeat(18)).slice(0, 18));
  return w > 0n ? w.toString() : null;
}

async function openReceive(k) {
  if (!addr) { await connectWallet(); if (!addr) return; }
  sel = k;
  document.getElementById('ttl').textContent = 'Receive ' + k;
  document.getElementById('inp').style.display = k === 'SHM' ? 'block' : 'none';
  document.getElementById('addrBox').textContent = addr;
  document.getElementById('shade').classList.add('open');
  drawQR();
}
function closeSheet() { document.getElementById('shade').classList.remove('open'); }

function drawQR() {
  if (!addr) return;
  let text = addr, cap = 'Scan to send ' + sel + ' to this wallet';
  if (sel === 'SHM') {
    const amount = document.getElementById('payAmount').value.trim(), wei = toWei(amount);
    if (wei) { text = 'ethereum:' + addr + '@8118?value=' + wei; cap = 'Scan to pay ' + amount + ' SHM'; }
  } else {
    cap = 'Address only – ' + sel + ' amount QR is not set up';
  }
  document.getElementById('cap').textContent = cap;
  const box = document.getElementById('qrcode');
  box.innerHTML = '';
  new QRCode(box, {text, width: 170, height: 170, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H});
}

/* ---------- WALLET ---------- */
async function connectWallet() {
  if (!window.ethereum) { alert('MetaMask not found!'); return; }
  try {
    const a = await ethereum.request({method: 'eth_requestAccounts'});
    addr = a[0];
    let c = await ethereum.request({method: 'eth_chainId'});
    if (c !== CHAIN) {
      try { await ethereum.request({method: 'wallet_switchEthereumChain', params: [{chainId: CHAIN}]}); c = await ethereum.request({method: 'eth_chainId'}); } catch (e) {}
    }
    const ok = c === CHAIN;
    if (ok) {
      const h = await ethereum.request({method: 'eth_getBalance', params: [addr, 'latest']});
      T.SHM.bal = (Number(BigInt(h)) / 1e18).toFixed(3);
    }
    document.getElementById('warn').style.display = ok ? 'none' : 'block';
    const chip = document.getElementById('chip');
    chip.textContent = addr.slice(0, 6) + '…' + addr.slice(-4);
    chip.classList.add('on');
    chip.onclick = null;
    paintList();
  } catch (e) { alert('Error: ' + e.message); }
}

function copyAddress() {
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✓ Copied';
    setTimeout(() => b.textContent = 'Copy address', 2000);
  });
}

/* ---------- SEND (native SHM only) ---------- */
function closeAll() { document.querySelectorAll('.shade').forEach(s => s.classList.remove('open')); }

function sendMsg(text, good) {
  const m = document.getElementById('sendMsg');
  m.textContent = text;
  m.className = 'msg' + (good ? ' ok' : '');
}

async function openSend() {
  if (!addr) { await connectWallet(); if (!addr) return; }
  sendMsg('');
  document.getElementById('sheetSend').classList.add('open');
}

async function refreshBal() {
  const h = await ethereum.request({method: 'eth_getBalance', params: [addr, 'latest']});
  T.SHM.bal = (Number(BigInt(h)) / 1e18).toFixed(3);
  paintList();
}

async function sendSHM() {
  const to = document.getElementById('sendTo').value.trim();
  const amt = document.getElementById('sendAmt').value.trim();
  const wei = toWei(amt);
  if (!/^0x[0-9a-fA-F]{40}$/.test(to)) return sendMsg('Enter a valid 0x address');
  if (!wei) return sendMsg('Enter a valid amount');
  if (parseFloat(amt) > parseFloat(T.SHM.bal)) return sendMsg('Not enough SHM balance');
  try {
    if (await ethereum.request({method: 'eth_chainId'}) !== CHAIN) return sendMsg('Switch MetaMask to Shardeum EVM (8118)');
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    sendMsg('Confirm in MetaMask…');
    const hash = await ethereum.request({method: 'eth_sendTransaction', params: [{from: addr, to, value: '0x' + BigInt(wei).toString(16)}]});
    sendMsg('Sent ✓ ' + hash.slice(0, 10) + '…', true);
    document.getElementById('sendAmt').value = '';
    setTimeout(refreshBal, 4000);
  } catch (e) {
    sendMsg(e.code === 4001 ? 'Cancelled in MetaMask' : (e.message || 'Transaction failed'));
  }
  document.getElementById('sendBtn').disabled = false;
}

/* ---------- SETTINGS ---------- */
function openSettings() {
  document.getElementById('setAddr').textContent = addr || 'Not connected';
  document.getElementById('sheetSet').classList.add('open');
}

if (window.ethereum) {
  ethereum.on('chainChanged', () => location.reload());
  ethereum.on('accountsChanged', () => location.reload());
}

window.onload = () => {
  paintList();
  fetchPrices();
  setInterval(fetchPrices, 30000);
};
</script>
</body>
</html>
