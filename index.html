<script>
const $ = id => document.getElementById(id);
const ls = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

const NETWORKS = {
  shardeum: {
    name: 'Shardeum EVM',
    chainId: '0x1fb7',
    chainIdDec: 8119,
    symbol: 'SHM',
    rpc: 'https://api-mezame.shardeum.org',
    explorer: 'https://explorer-mezame.shardeum.org',
    decimals: 18
  },
  ethereum: {
    name: 'Ethereum',
    chainId: '0x1',
    chainIdDec: 1,
    symbol: 'ETH',
    rpc: 'https://cloudflare-eth.com',
    explorer: 'https://etherscan.io',
    decimals: 18
  },
  bsc: {
    name: 'BNB Chain',
    chainId: '0x38',
    chainIdDec: 56,
    symbol: 'BNB',
    rpc: 'https://bsc-dataseed.binance.org',
    explorer: 'https://bscscan.com',
    decimals: 18
  }
};

let currentNet = 'shardeum';
let addr = '';
let fxCache = 89.5;
let lastBal = null;
let lastOk = 0;
let currentCur = 'INR';
let currentLang = 'en';
let soundEnabled = ls.get('sound', true);
let hideBal = ls.get('hide', false);
let txs = ls.get('txs', []);

const LOGO = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="24" fill="#000"/><circle cx="50" cy="50" r="36" fill="#FFC21A"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="3"/><path d="M63 37a19 19 0 1 0 0 26" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round"/></svg>';

const ICONS = {
  SHM: '<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="16" fill="#2563eb"/><path d="M16 8l8 13H8z" fill="#fff"/></svg>',
  USDT: '<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="16" fill="#26a17b"/><path d="M17.5 15.5v-3.5h3v-2.5h-9v2.5h3v3.5c-3.2.2-5.5 1-5.5 2s2.3 1.8 5.5 2v4.5h3v-4.5c3.2-.2 5.5-1 5.5-2s-2.3-1.8-5.5-2zm-1.5 3.5c-2.2 0-4-.6-4-1.2s1.8-1.2 4-1.2 4 .6 4 1.2-1.8 1.2-4 1.2z" fill="#fff"/></svg>',
  BTC: '<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="16" fill="#f7931a"/><path d="M21.5 14.5c.3-.8.1-2.4-1-3.3-.9-.7-2.3-.9-3.9-.9h-3.6v9.4h4.1c1.8 0 3.2-.3 4-1.1.7-.8.9-2.3.4-4.1zm-4.7-3.4c.8 0 1.5.2 1.9.6.4.4.6 1.1.2 2-.4.9-1.2 1.4-2.1 1.4h-1.8v-4h2zm.5 7.7h-2.3v4.4h2.5c1 0 1.8-.2 2.3-.7.5-.5.7-1.3.3-2.2-.4-.9-1.1-1.5-2.8-1.5z" fill="#fff"/></svg>',
  ETH: '<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="16" fill="#627eea"/><path d="M16 6l-7 11.5L16 21l7-3.5z" fill="#c0cbef"/><path d="M16 6v15l7-3.5z" fill="#fff"/><path d="M16 22l-7-3.5L16 26l7-7.5z" fill="#c0cbef"/><path d="M16 22v4l7-7.5z" fill="#fff"/></svg>',
  BNB: '<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="16" fill="#f3ba2f"/><path d="M16 9l-4 4 4 4 4-4-4-4zm-6 6l-3 3 3 3 3-3-3-3zm12 0l-3 3 3 3 3-3-3-3zm-6 6l-4 4 4 4 4-4-4-4z" fill="#fff"/></svg>'
};

const T = {
  SHM: {name:'Shardeum', bal:'0.000', p:null},
  USDT:{name:'Tether', bal:'0.00', p:null},
  BTC: {name:'Bitcoin', bal:'0.000000', p:null},
  ETH: {name:'Ethereum', bal:'0.0000', p:null},
  BNB: {name:'BNB', bal:'0.0000', p:null}
};

const I18N = {
  en:{total:'Total Balance',send:'Send',recv:'Receive',buy:'Buy',swap:'Swap',assets:'Crypto Assets',tx:'Recent Transactions',disc:'⚠ Crypto is risky. Only use what you can afford to lose. Keys stay in your wallet. Not financial advice.'},
  hi:{total:'कुल बैलेंस',send:'भेजें',recv:'प्राप्त करें',buy:'खरीदें',swap:'स्वैप',assets:'क्रिप्टो एसेट्स',tx:'हाल के लेन-देन',disc:'⚠ क्रिप्टो जोखिम भरा है। केवल उतना ही इस्तेमाल करें जितना खो सकते हैं।'},
  mr:{total:'एकूण शिल्लक',send:'पाठवा',recv:'स्वीकारा',buy:'खरेदी',swap:'स्वॅप',assets:'क्रिप्टो मालमत्ता',tx:'नुकतेच झालेले व्यवहार',disc:'⚠ क्रिप्टो जोखमीचे आहे. फक्त गमावू शकता तेवढेच वापरा.'}
};

function changeCurrency(c){currentCur=c;paintList()}
function changeLang(l){
  currentLang=l;
  const d=I18N[l];
  $('lblTotal').textContent=d.total;
  $('btnSend').textContent=d.send;
  $('btnRecv').textContent=d.recv;
  $('btnBuy').textContent=d.buy;
  $('navSwap').textContent=d.swap;
  $('tabAssets').textContent=d.assets;
  $('txtTxTitle').textContent=d.tx;
  $('disclaimer').textContent=d.disc;
}
function changeNetwork(key){
  currentNet=key;
  const n=NETWORKS[key];
  $('netLabel').textContent=n.name;
  $('setNet').textContent=n.name;
  $('sendUnit').textContent=n.symbol;
  $('recvUnit').textContent=n.symbol;
  $('sendTitle').textContent='Send '+n.symbol;
  $('ttl').textContent='Receive '+n.symbol;
  if(addr) ensureNetwork().then(()=>readBal(false));
  paintList();
}

let AC;
function chime(){
  if(!soundEnabled)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.12;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.45);
    });
  }catch(e){}
}
function applySound(){
  $('soundBtn').className='sound-toggle '+(soundEnabled?'on':'');$('soundBtn').textContent=soundEnabled?'🔊':'🔇';
  if($('setSound'))$('setSound').textContent=soundEnabled?'On':'Off';
}
function toggleSound(){soundEnabled=!soundEnabled;ls.set('sound',soundEnabled);applySound()}
function togglePriv(){hideBal=!hideBal;ls.set('hide',hideBal);if($('setPriv'))$('setPriv').textContent=hideBal?'On':'Off';paintList()}

function fmt(n){
  if(!n||n===0)return'0.00';
  if(n<0.0001)return n.toFixed(8);
  if(n<0.01)return n.toFixed(5);
  if(n<1)return n.toFixed(4);
  return n.toLocaleString('en-IN',{maximumFractionDigits:2});
}
function getCurPrefix(){return currentCur==='INR'?'₹':'$'}
function getConverted(p){return p?(currentCur==='INR'?p.inr:p.usd):0}
const soon=()=>alert('Coming soon');async function getJSON(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
async function usdToInr(){
  try{
    const d=await getJSON('https://open.er-api.com/v6/latest/USD');
    if(d?.rates?.INR)fxCache=d.rates.INR;
  }catch(e){}
}
async function fetchPrices(){
  try{
    const cg=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=shardeum,ethereum,binancecoin,bitcoin,tether&vs_currencies=usd,inr&include_24hr_change=true');
    if(cg.shardeum)T.SHM.p={usd:cg.shardeum.usd,inr:cg.shardeum.inr||cg.shardeum.usd*fxCache,chg:cg.shardeum.usd_24h_change||0};
    if(cg.ethereum)T.ETH.p={usd:cg.ethereum.usd,inr:cg.ethereum.inr||cg.ethereum.usd*fxCache,chg:cg.ethereum.usd_24h_change||0};
    if(cg.binancecoin)T.BNB.p={usd:cg.binancecoin.usd,inr:cg.binancecoin.inr||cg.binancecoin.usd*fxCache,chg:cg.binancecoin.usd_24h_change||0};
    if(cg.bitcoin)T.BTC.p={usd:cg.bitcoin.usd,inr:cg.bitcoin.inr||cg.bitcoin.usd*fxCache,chg:cg.bitcoin.usd_24h_change||0};
    if(cg.tether)T.USDT.p={usd:cg.tether.usd,inr:cg.tether.inr||fxCache,chg:0};
    lastOk=Date.now();
  }catch(e){}
  paintList();
}
function refreshAll(){usdToInr();fetchPrices()}

function buildList(){
  const order=['SHM','USDT','BTC','ETH','BNB'];
  $('list').innerHTML=order.map(k=>{
    const iconSvg = ICONS[k] || '';
    return `<div class="row" onclick="openReceive()">
      <div class="ic">${iconSvg}</div>
      <div class="mid"><div class="sym">${k}</div><div class="sub" id="s-${k}"></div></div>
      <div class="rt"><div class="amt" id="b-${k}"></div><div class="sub" id="v-${k}"></div></div>
    </div>`;
  }).join('');
}
function paintList(){
  let total=0;
  const pfx=getCurPrefix(),H='••••';
  const net=NETWORKS[currentNet];
  const nativeKey=net.symbol;
  Object.keys(T).forEach(k=>{
    const t=T[k],p=t.p,bal=parseFloat(t.bal)||0,rate=getConverted(p);
    if(bal>0&&rate)total+=bal*rate;
    const chg=p&&typeof p.chg==='number'?` <span style="color:${p.chg<0?'var(--r)':'var(--g)'}">${p.chg>=0?'+':''}${p.chg.toFixed(2)}%</span>`:'';
    if($('s-'+k))$('s-'+k).innerHTML=p?pfx+fmt(rate)+chg:pfx+'--';
    if($('b-'+k))$('b-'+k).textContent=hideBal?H:(k===nativeKey?t.bal:'0.000');
    if($('v-'+k))$('v-'+k).textContent=hideBal?H:(p&&k===nativeKey?pfx+fmt(bal*rate):pfx+'0.00');
  });
  $('total').textContent=hideBal?pfx+H:pfx+fmt(total);
  const live=Date.now()-lastOk<40000;
  $('feed').className='feed'+(live?'':' bad');$('feedText').textContent=live?'Live Market Connected':'Prices delayed';
}

function renderTx(){
  $('txHistory').innerHTML=txs.length?txs.map(x=>{
    const d=new Date(x.time).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
    return `<div class="tx-item"><div><b>${x.type==='in'?'Received':'Sent'} ${x.symbol}</b><div style="color:var(--mut);font-size:10px">${d}</div></div>
      <div class="${x.type==='in'?'tx-in':'tx-out'}">${x.type==='in'?'+':'-'}${x.amt} ${x.symbol}</div></div>`;
  }).join(''):'<div class="tx-empty">No transactions yet</div>';
}
function logTx(type,amt,symbol){
  txs.unshift({type,amt,symbol,time:Date.now()});
  txs=txs.slice(0,20);
  ls.set('txs',txs);
  renderTx();
}

function toWei(s){
  if(!/^\d*\.?\d*$/.test(s)||s===''||s==='.')return null;
  const [i,f='']=s.split('.');
  return (BigInt(i||'0')*10n**18n+BigInt((f+'0'.repeat(18)).slice(0,18))).toString();
}

async function ensureNetwork(){
  const n=NETWORKS[currentNet];
  try{
    await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:n.chainId}]});
    return true;
  }catch(e){
    if(e.code===4902||e.code===-32603){
      try{
        await ethereum.request({
          method:'wallet_addEthereumChain',
          params:[{
            chainId:n.chainId,
            chainName:n.name,
            nativeCurrency:{name:n.symbol,symbol:n.symbol,decimals:18},
            rpcUrls:[n.rpc],
            blockExplorerUrls:[n.explorer]
          }]
        });
        return true;
      }catch(err){return false}
    }
    return false;
  }
}

async function connectWallet(){
  if(!window.ethereum){alert('Please install MetaMask or another EVM wallet');return}
  try{
    const accounts=await ethereum.request({method:'eth_requestAccounts'});
    addr=accounts[0];
    await ensureNetwork();
    const chainId=await ethereum.request({method:'eth_chainId'});
    const ok=chainId===NETWORKS[currentNet].chainId;
    if(ok)await readBal(false);
    $('warn').style.display=ok?'none':'block';
    const chip=$('chip');
    chip.textContent=addr.slice(0,6)+'…'+addr.slice(-4);
    chip.classList.add('on');
    chip.onclick=null;
    paintList();
  }catch(e){
    if(e.code!==4001)alert('Error: '+(e.message||'Failed'));
  }
}

async function readBal(detect){
  if(!addr)return;
  try{
    const n=NETWORKS[currentNet];
    const h=await ethereum.request({method:'eth_getBalance',params:[addr,'latest']});
    const val=Number(BigInt(h))/1e18;
    const key=n.symbol;
    if(detect&&lastBal!==null&&val>lastBal+1e-9){
      const got=(val-lastBal).toFixed(4);
      logTx('in',got,key);
      chime();
    }
    lastBal=val;
    T[key].bal=val.toFixed(4);
    paintList();
  }catch(e){}
}
async function pollBal(){
  if(!addr||!window.ethereum)return;
  try{
    const chainId=await ethereum.request({method:'eth_chainId'});
    if(chainId===NETWORKS[currentNet].chainId)await readBal(true);
  }catch(e){}
}

function closeAll(){stopScan();document.querySelectorAll('.shade').forEach(s=>s.classList.remove('open'))}
function closeSheet(){$('shade').classList.remove('open')}
function sendMsg(t,ok){const m=$('sendMsg');m.textContent=t;m.className='msg'+(ok?' ok':'')}

async function openSend(){
  if(!addr){await connectWallet();if(!addr)return}
  sendMsg('');
  $('sheetSend').classList.add('open');
}
async function doSend(){
  const to=$('sendTo').value.trim();
  const amt=$('sendAmt').value.trim();
  const wei=toWei(amt);
  const n=NETWORKS[currentNet];
  if(!/^0x[0-9a-fA-F]{40}$/.test(to))return sendMsg('Invalid address');
  if(!wei)return sendMsg('Invalid amount');
  if(parseFloat(amt)>parseFloat(T[n.symbol].bal)+0.0001)return sendMsg('Insufficient balance');
  if(!confirm(`Send ${amt} ${n.symbol} to\n${to}\n\nConfirm?`))return;
  try{
    const chainId=await ethereum.request({method:'eth_chainId'});
    if(chainId!==n.chainId)return sendMsg('Wrong network. Switch first.');
    $('sendBtn').disabled=true;
    sendMsg('Confirm in wallet…');
    const hash=await ethereum.request({
      method:'eth_sendTransaction',
      params:[{from:addr,to,value:'0x'+BigInt(wei).toString(16)}]
    });
    sendMsg('Sent ✓ '+hash.slice(0,12)+'…',true);
    chime();
    logTx('out',amt,n.symbol);
    $('sendAmt').value='';
    setTimeout(pollBal,6000);
  }catch(e){
    sendMsg(e.code===4001?'Cancelled':(e.message||'Failed'));
  }
  $('sendBtn').disabled=false;
}

async function openReceive(){
  if(!addr){await connectWallet();if(!addr)return}
  const n=NETWORKS[currentNet];
  $('ttl').textContent='Receive '+n.symbol;
  $('recvUnit').textContent=n.symbol;
  $('addrBox').textContent=addr;
  $('shade').classList.add('open');
  drawQR();
}
function drawQR(){
  if(!addr)return;
  const box=$('qrcode');
  box.innerHTML='';
  const n=NETWORKS[currentNet];
  let text=addr;
  const amount=$('payAmount').value.trim();
  const wei=toWei(amount);
  if(wei){
    text=`ethereum:${addr}@${n.chainIdDec}?value=${wei}`;
  }
  $('cap').textContent=`Only send ${n.symbol} on ${n.name}`;
  new QRCode(box,{text,width:170,height:170,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
}
function copyAddress(){
  if(!addr)return;
  navigator.clipboard.writeText(addr).then(()=>{
    const b=$('copyBtn');b.textContent='✓ Copied';
    setTimeout(()=>b.textContent='Copy Address',2000);
  });
}

let scanning=false,scanStream=null;
function stopScan(){
  scanning=false;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  $('scanVid').style.display='none';
}
async function scanQR(){
  if(!('BarcodeDetector' in window))return sendMsg('QR scan not supported. Paste address.');
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('scanVid');v.srcObject=scanStream;v.style.display='block';await v.play();
    const det=new BarcodeDetector({formats:['qr_code']});
    scanning=true;
    while(scanning){
      try{
        const r=await det.detect(v);
        if(r.length){handleScan(r[0].rawValue);break}
      }catch(e){}
      await new Promise(r=>setTimeout(r,300));
    }
  }catch(e){sendMsg('Camera permission needed');stopScan()}
}
function handleScan(text){
  stopScan();
  const m=text.match(/0x[0-9a-fA-F]{40}/);
  if(!m)return sendMsg('No address found');
  $('sendTo').value=m[0];
  sendMsg('Scanned ✓',true);
}

function openSettings(){
  $('setAddr').textContent=addr\vert{}\vert{}'Not connected';$('setNet').textContent=NETWORKS[currentNet].name;
  applySound();
  $('sheetSet').classList.add('open');
}

if(window.ethereum){
  ethereum.on('chainChanged',()=>location.reload());
  ethereum.on('accountsChanged',()=>location.reload());
}

window.onload=()=>{
  $('logo').innerHTML=LOGO;
  applySound();
  renderTx();
  buildList();
  paintList();
  changeLang(currentLang);
  changeNetwork(currentNet);
  usdToInr().then(fetchPrices);
  setInterval(fetchPrices,15000);
  setInterval(usdToInr,600000);
  setInterval(pollBal,10000);
};
</script>

<script>
const CHAIN = '0x1fb6'; // Shardeum EVM = 8118

const SHM_SVG = '<svg width="24" height="24" viewBox="0 0 400 400"><polygon points="172,60 70,255 122,255 200,120" fill="#f5a623"/><polygon points="228,60 330,255 278,255 200,120" fill="#f5a623"/><polygon points="120,268 280,268 312,328 88,328" fill="#f5a623"/><circle cx="200" cy="214" r="38" fill="#f5a623"/></svg>';

const T = {
  SHM:  {name:'Shardeum',   customSvg: SHM_SVG, cg:'shardeum', bal:'0.000', p:null},
  USDT: {name:'Tether USD', img:'https://assets.coingecko.com/coins/images/325/large/Tether.png', cg:'tether', bal:'0.00', p:null},
  BTC:  {name:'Bitcoin',    img:'https://assets.coingecko.com/coins/images/1/large/bitcoin.png', cg:'bitcoin', bn:'BTCUSDT', bal:'0.000000', p:null},
  ETH:  {name:'Ethereum',   img:'https://assets.coingecko.com/coins/images/279/large/ethereum.png', cg:'ethereum', bn:'ETHUSDT', bal:'0.0000', p:null},
  BNB:  {name:'BNB',        img:'https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png', cg:'binancecoin', bn:'BNBUSDT', bal:'0.0000', p:null}
};
let addr = '', sel = 'SHM', fxCache = 0;

const fmt = n => n.toLocaleString('en-IN', {maximumFractionDigits: n < 1 ? 4 : 2});
const soon = () => alert('Coming soon');

function icon(k) {
  const t = T[k];
  if(t.customSvg) return `<div class="ic">${t.customSvg}</div>`;
  return `<div class="ic"><img src="${t.img}" alt="${k}"></div>`;
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}
async function usdToInr() {
  if (fxCache) return fxCache;
  try {
    const d = await getJSON('https://open.er-api.com/v6/latest/USD');
    return (fxCache = d.rates.INR);
  } catch(e) {
    return (fxCache = 89.5);
  }
}

async function fetchPrices() {
  const got = {};
  try {
    const d = await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=' +
      Object.values(T).map(t => t.cg).join(',') + '&vs_currencies=usd,inr&include_24hr_change=true');
    for (const k in T) {
      const x = d[T[k].cg];
      if (x && x.inr) got[k] = {usd: x.usd, inr: x.inr, chg: x.inr_24h_change ?? x.usd_24h_change};
    }
  } catch (e) {}

  const need = Object.keys(T).filter(k => !got[k] && T[k].bn);
  if (need.length) {
    try {
      const syms = encodeURIComponent(JSON.stringify(need.map(k => T[k].bn)));
      const [rows, fx] = await Promise.all([getJSON('https://api.binance.com/api/v3/ticker/24hr?symbols=' + syms), usdToInr()]);
      rows.forEach(r => {
        const k = need.find(n => T[n].bn === r.symbol), usd = parseFloat(r.lastPrice);
        if (k && usd) got[k] = {usd, inr: usd * fx, chg: parseFloat(r.priceChangePercent)};
      });
    } catch (e) {}
  }

  if (!got.SHM || got.SHM.inr < 1) {
    got.SHM = {usd: 0.50, inr: 45.00, chg: 1.5};
  }

  for (const k in T) T[k].p = got[k] || null;
  const live = Object.values(T).some(t => t.p), f = document.getElementById('feed');
  f.className = 'feed ' + (live ? 'ok' : 'bad');
  f.textContent = live ? 'Live prices active' : 'Price unavailable';
  paintList();
}

function paintList() {
  let total = 0, missing = false;
  document.getElementById('list').innerHTML = Object.keys(T).map(k => {
    const t = T[k], p = t.p, bal = parseFloat(t.bal) || 0;
    if (bal > 0) { if (p) total += bal * p.inr; else missing = true; }
    const chg = p && typeof p.chg === 'number'
      ? ' <span style="color:' + (p.chg < 0 ? 'var(--r)' : 'var(--g)') + '">' + (p.chg >= 0 ? '+' : '') + p.chg.toFixed(2) + '%</span>' : '';
    const sub = p ? '₹' + fmt(p.inr) + chg : '<span style="color:var(--r)">Price unavailable</span>';
    return '<div class="row" onclick="openReceive(\'' + k + '\')">' + icon(k) +
      '<div class="mid"><div class="sym">' + k + '</div><div class="sub">' + sub + '</div></div>' +
      '<div class="rt"><div class="amt">' + t.bal + '</div><div class="sub">' + (p ? '₹' + fmt(bal * p.inr) : '—') + '</div></div></div>';
  }).join('');
  document.getElementById('total').textContent = missing ? '—' : '₹' + fmt(total);
}

function toWei(s) {
  if (!/^\d*\.?\d*$/.test(s) || s === '.' || s === '') return null;
  const [i, f = ''] = s.split('.');
  const w = BigInt(i || '0') * 10n ** 18n + BigInt((f + '0'.repeat(18)).slice(0, 18));
  return w > 0n ? w.toString() : null;
}

async function openReceive(k) {
  if (!addr) { await connectWallet(); if (!addr) return; }
  sel = k;
  document.getElementById('ttl').textContent = 'Receive ' + k;
  document.getElementById('inp').style.display = k === 'SHM' ? 'block' : 'none';
  document.getElementById('addrBox').textContent = addr;
  document.getElementById('shade').classList.add('open');
  drawQR();
}
function closeSheet() { document.getElementById('shade').classList.remove('open'); }

function drawQR() {
  if (!addr) return;
  let text = addr, cap = 'Scan to send ' + sel + ' to this wallet';
  if (sel === 'SHM') {
    const amount = document.getElementById('payAmount').value.trim(), wei = toWei(amount);
    if (wei) { text = 'ethereum:' + addr + '@8118?value=' + wei; cap = 'Scan to pay ' + amount + ' SHM'; }
  } else {
    cap = 'Address only – ' + sel + ' amount QR is not set up';
  }
  document.getElementById('cap').textContent = cap;
  const box = document.getElementById('qrcode');
  box.innerHTML = '';
  new QRCode(box, {text, width: 170, height: 170, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H});
}

async function connectWallet() {
  if (!window.ethereum) { alert('MetaMask not found!'); return; }
  try {
    const a = await ethereum.request({method: 'eth_requestAccounts'});
    addr = a[0];
    let c = await ethereum.request({method: 'eth_chainId'});
    if (c !== CHAIN) {
      try { await ethereum.request({method: 'wallet_switchEthereumChain', params: [{chainId: CHAIN}]}); c = await ethereum.request({method: 'eth_chainId'}); } catch (e) {}
    }
    const ok = c === CHAIN;
    if (ok) {
      const h = await ethereum.request({method: 'eth_getBalance', params: [addr, 'latest']});
      T.SHM.bal = (Number(BigInt(h)) / 1e18).toFixed(3);
    }
    document.getElementById('warn').style.display = ok ? 'none' : 'block';
    const chip = document.getElementById('chip');
    chip.textContent = addr.slice(0, 6) + '…' + addr.slice(-4);
    chip.classList.add('on');
    chip.onclick = null;
    paintList();
  } catch (e) { alert('Error: ' + e.message); }
}

function copyAddress() {
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✓ Copied';
    setTimeout(() => b.textContent = 'Copy address', 2000);
  });
}

function closeAll() { document.querySelectorAll('.shade').forEach(s => s.classList.remove('open')); }

function sendMsg(text, good) {
  const m = document.getElementById('sendMsg');
  m.textContent = text;
  m.className = 'msg' + (good ? ' ok' : '');
}

async function openSend() {
  if (!addr) { await connectWallet(); if (!addr) return; }
  sendMsg('');
  document.getElementById('sheetSend').classList.add('open');
}

async function refreshBal() {
  const h = await ethereum.request({method: 'eth_getBalance', params: [addr, 'latest']});
  T.SHM.bal = (Number(BigInt(h)) / 1e18).toFixed(3);
  paintList();
}

async function sendSHM() {
  const to = document.getElementById('sendTo').value.trim();
  const amt = document.getElementById('sendAmt').value.trim();
  const wei = toWei(amt);
  if (!/^0x[0-9a-fA-F]{40}$/.test(to)) return sendMsg('Enter a valid 0x address');
  if (!wei) return sendMsg('Enter a valid amount');
  if (parseFloat(amt) > parseFloat(T.SHM.bal)) return sendMsg('Not enough SHM balance');
  try {
    if (await ethereum.request({method: 'eth_chainId'}) !== CHAIN) return sendMsg('Switch MetaMask to Shardeum EVM (8118)');
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    sendMsg('Confirm in MetaMask…');
    const hash = await ethereum.request({method: 'eth_sendTransaction', params: [{from: addr, to, value: '0x' + BigInt(wei).toString(16)}]});
    sendMsg('Sent ✓ ' + hash.slice(0, 10) + '…', true);
    document.getElementById('sendAmt').value = '';
    setTimeout(refreshBal, 4000);
  } catch (e) {
    sendMsg(e.code === 4001 ? 'Cancelled in MetaMask' : (e.message || 'Transaction failed'));
  }
  document.getElementById('sendBtn').disabled = false;
}

function openSettings() {
  document.getElementById('setAddr').textContent = addr || 'Not connected';
  document.getElementById('sheetSet').classList.add('open');
}

if (window.ethereum) {
  ethereum.on('chainChanged', () => location.reload());
  ethereum.on('accountsChanged', () => location.reload());
}

window.onload = () => {
  paintList();
  fetchPrices();
  setInterval(fetchPrices, 30000);
};
</script>
