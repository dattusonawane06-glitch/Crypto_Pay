<style>
:root{--bg:#060A14;--b:#2B6DF6;--t:#2DD4BF;--tx:#EAF0FB;--mut:#9AA9C4;--ln:rgba(255,255,255,.09);--card:rgba(255,255,255,.045)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Inter,system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;
background-image:radial-gradient(60% 38% at 10% 0%,rgba(43,109,246,.28),transparent 70%),radial-gradient(45% 30% at 96% 10%,rgba(45,212,191,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(130,90,255,.12),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.grad{background:linear-gradient(90deg,#7FB0FF,#2DD4BF);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#7FE3D3;margin-bottom:10px}
h1,h2{text-wrap:balance}
h2{font-size:clamp(26px,4.2vw,38px);letter-spacing:-.6px;line-height:1.18;margin-bottom:10px}
.lead{color:var(--mut);max-width:660px;margin-bottom:28px}
section{padding:60px 0;position:relative}
/* nav */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(6,10,20,.74);border-bottom:1px solid var(--ln)}
nav .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand img{width:34px;height:34px;border-radius:9px}
.links{margin-left:auto;display:flex;gap:20px;font-size:14px;color:var(--mut)}
.links a:hover{color:var(--tx)}
.lang{border:1px solid var(--ln);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
@media(max-width:900px){.links{display:none}.lang{margin-left:auto}}
@media(max-width:380px){.brand span{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px;border:1px solid var(--ln);background:rgba(255,255,255,.06);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,#3F7DFF,#2B5BE6);border-color:transparent;box-shadow:0 10px 28px rgba(43,100,230,.4)}
.btn.sm{padding:9px 16px;font-size:14px;border-radius:12px}
.navcta{padding:8px 13px;font-size:13px;white-space:nowrap;border-radius:11px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
/* hero */
.hero{position:relative;overflow:hidden;padding:46px 0 30px}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(45,212,191,.4);background:rgba(45,212,191,.1);color:#A8F5E8;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--t);box-shadow:0 0 10px var(--t);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
h1{font-size:clamp(33px,5.1vw,54px);line-height:1.1;margin:18px 0 14px;letter-spacing:-1.2px}
.sub{color:var(--mut);font-size:18px;max-width:540px}
.stage{position:relative;width:100%;max-width:520px;height:540px;justify-self:center}
@media(max-width:860px){.stage{height:470px}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.node{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:2;transform:rotate(45deg);border-radius:9px;border:1.5px solid rgba(111,160,255,.75);background:rgba(14,22,40,.85);box-shadow:0 0 18px rgba(77,134,255,.35);transition:box-shadow .2s,border-color .2s,background .2s}
.node::after{content:"";position:absolute;inset:8px;border-radius:3px;background:linear-gradient(135deg,#6FA0FF,#2DD4BF);opacity:.9}
.node.hit{box-shadow:0 0 34px rgba(45,212,191,.95);border-color:#2DD4BF;background:rgba(20,60,70,.9)}
.phone{position:absolute;right:2%;top:50%;transform:translateY(-50%);width:min(250px,48%);border-radius:36px;padding:8px;z-index:1;border:1px solid rgba(120,170,255,.4);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));box-shadow:0 0 50px rgba(59,123,255,.28),0 30px 60px rgba(0,0,0,.5)}
.phone img{display:block;width:100%;height:auto}
.screen{position:relative;overflow:hidden;border-radius:28px;background:#0B1222;aspect-ratio:720/1250}
.lay{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform,opacity}
.app-header{position:absolute;left:0;top:0;z-index:2}
.app-nav{position:absolute;left:0;bottom:0;z-index:2}
.hl{position:absolute;z-index:3;left:2.5%;width:95%;top:64.4%;height:11.2%;border-radius:16px;opacity:0;transition:opacity .45s;background:rgba(45,212,191,.08);box-shadow:0 0 0 1.5px rgba(45,212,191,.85),0 0 26px rgba(45,212,191,.5);pointer-events:none}
.hl.on{opacity:1;animation:hlp 1.3s ease-in-out infinite}
@keyframes hlp{50%{box-shadow:0 0 0 1.5px rgba(45,212,191,1),0 0 40px rgba(45,212,191,.85)}}
.phone.glow{animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 50px rgba(59,123,255,.28)}30%{box-shadow:0 0 90px rgba(45,212,191,.85),0 0 40px rgba(111,160,255,.8)}100%{box-shadow:0 0 50px rgba(59,123,255,.28),0 30px 60px rgba(0,0,0,.5)}}
.pop{position:absolute;z-index:4;font-weight:800;font-size:15px;color:#9FF3E3;text-shadow:0 0 12px rgba(45,212,191,.9);pointer-events:none;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.05)}}
.cap{position:absolute;left:0;bottom:2px;z-index:4;font-size:11.5px;color:var(--mut)}
/* chips */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.chips{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.chips{grid-template-columns:1fr}}
.chip{display:flex;align-items:center;gap:12px;border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600}
.ic{flex:none;width:40px;height:40px;border-radius:12px;border:1.3px solid transparent;background:linear-gradient(#0E1628,#0E1628) padding-box,linear-gradient(135deg,rgba(111,160,255,.85),rgba(45,212,191,.6)) border-box;display:grid;place-items:center;box-shadow:0 0 16px rgba(77,134,255,.22)}
.ic svg{width:21px;height:21px;fill:none;stroke:#8FB8FF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:20px;padding:20px}
.span2{grid-column:span 2}
@media(max-width:540px){.span2{grid-column:auto}}
.card h3{font-size:17px;margin:12px 0 6px}
.card p{color:var(--mut);font-size:14.5px}
.card a.more{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:#8FD0FF}
.card a.more:hover{text-decoration:underline}
/* screens */
.screens{scrollbar-width:thin;display:flex;gap:22px;justify-content:center;align-items:flex-end;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 20px;-webkit-overflow-scrolling:touch}
.screens figure{flex:none;width:230px;scroll-snap-align:center;text-align:center}
.screens figure:nth-child(2){width:260px}
.screens .phone{position:relative;right:auto;top:auto;transform:none;width:100%}
.screens figcaption{margin-top:12px;font-size:14px;color:var(--mut)}
.screens figcaption b{display:block;color:var(--tx);font-size:15px}
@media(max-width:820px){.screens{justify-content:flex-start}}
/* steps */
.steps .card{position:relative;padding-top:56px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:20px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#3F7DFF,#2DD4BF);display:grid;place-items:center;font-weight:800}
.steps{counter-reset:s}
/* kv */
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14.5px}
.kv span:first-child{color:var(--mut)}
.kv b{text-align:right;overflow-wrap:anywhere}
.ok{color:#9FF3E3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.copy{border:1px solid var(--ln);background:rgba(255,255,255,.06);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;margin-left:6px}
/* rules */
.rules{list-style:none}
.rules li{padding:9px 0 9px 30px;position:relative;color:var(--mut);font-size:14.5px;border-bottom:1px solid var(--ln)}
.rules li:last-child{border:none}
.rules li::before{content:"✕";position:absolute;left:0;top:9px;color:#FF7B8A;font-weight:800}
/* tools */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;color:var(--mut)}
.tab.on{color:#fff;border-color:rgba(111,160,255,.8);background:rgba(43,109,246,.22)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.calc{grid-template-columns:1fr}}
.calc label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.calc input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:rgba(6,10,20,.7);color:var(--tx);font-size:16px;font-weight:600;outline:none}
.calc input:focus{border-color:#6FA0FF}
.res{border-radius:16px;border:1px solid rgba(45,212,191,.35);background:rgba(45,212,191,.07);padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:150px}
.res div{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.res div span:first-child{color:var(--mut)}
.res div b{font-size:17px}
.res .big b{font-size:24px}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
/* log */
.tl{list-style:none;border-left:2px solid rgba(111,160,255,.35);margin-left:6px}
.tl li{position:relative;padding:0 0 18px 22px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#6FA0FF,#2DD4BF);box-shadow:0 0 10px rgba(45,212,191,.6)}
.tl time{display:block;font-size:12px;font-weight:800;letter-spacing:1px;color:#7FE3D3;text-transform:uppercase}
.tl p{color:var(--tx);font-size:15px}
.road h4{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#7FE3D3;margin:2px 0 8px}
.road ul{list-style:none;margin-bottom:16px}
.road li{padding:7px 0 7px 22px;position:relative;font-size:15px;color:var(--tx)}
.road li::before{content:"→";position:absolute;left:0;color:#8FB8FF}
/* founder */
.founder{display:flex;gap:30px;align-items:center;flex-wrap:wrap;padding:28px}
.photo{width:170px;height:170px;border-radius:50%;object-fit:cover;flex:none;border:3px solid transparent;background:linear-gradient(#0B1222,#0B1222) padding-box,linear-gradient(135deg,#6FA0FF,#2DD4BF) border-box;box-shadow:0 0 36px rgba(59,123,255,.38)}
.founder .t{flex:1;min-width:250px}
.founder h3{font-size:24px;letter-spacing:-.4px}
.founder .role{color:#7FE3D3;font-weight:700;font-size:14px;margin:2px 0 10px}
.founder p{color:var(--mut)}
/* faq */
details{border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:#8FB8FF;font-weight:800}
details[open] summary::after{content:"–"}
details p{color:var(--mut);margin-top:8px;font-size:14.5px}
/* footer */
footer{border-top:1px solid var(--ln);padding:36px 0 90px;color:var(--mut);font-size:13px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:24px;margin-bottom:24px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}
.fgrid h5{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#C9D4E8;margin-bottom:10px}
.fgrid a,.fgrid button{display:block;background:none;border:none;color:var(--mut);padding:3px 0;font-size:14px;cursor:pointer;text-align:left}
.fgrid a:hover,.fgrid button:hover{color:var(--tx)}
footer p{max-width:760px;margin-bottom:8px}
/* fab */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;width:52px;height:52px;border-radius:50%;place-items:center;background:linear-gradient(135deg,#3F7DFF,#2B5BE6);box-shadow:0 8px 26px rgba(43,100,230,.55)}
.fab svg{width:28px;height:28px;fill:#fff}
.fab.show{display:grid;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
/* modal */
dialog{border:1px solid var(--ln);border-radius:20px;background:#0C1426;color:var(--tx);max-width:640px;width:calc(100% - 32px);padding:24px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog h3{font-size:22px;margin-bottom:12px}
dialog p,dialog li{color:var(--mut);font-size:14.5px;margin-bottom:10px}
dialog ul{padding-left:18px}
dialog .btn{margin-top:8px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
.soc{display:flex;justify-content:center;gap:16px;margin-top:26px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1.3px solid transparent;background:linear-gradient(#0E1628,#0E1628) padding-box,linear-gradient(135deg,rgba(111,160,255,.85),rgba(45,212,191,.6)) border-box;box-shadow:0 0 16px rgba(77,134,255,.22);transition:transform .15s}
.soc a:hover{transform:translateY(-2px)}
.soc svg{width:21px;height:21px;fill:#EAF0FB}
.pw{position:relative;flex:none}
.xbadge{position:absolute;right:-4px;bottom:8px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid transparent;background:linear-gradient(#0B1222,#0B1222) padding-box,linear-gradient(135deg,#6FA0FF,#2DD4BF) border-box;box-shadow:0 0 14px rgba(59,123,255,.4)}
.xbadge svg{width:18px;height:18px;fill:#EAF0FB}
</style>
</head>

<section id="features"><div class="wrap">
  <div class="reveal"><div class="eyebrow" data-en="What works today" data-hi="आज क्या चलता है"></div>
  <h2 data-en="Simple on the surface, careful underneath" data-hi="ऊपर से सरल, अंदर से सावधान"></h2>
  <p class="lead" data-en="Everything below is live in the test app on Shardeum Testnet." data-hi="नीचे की हर चीज़ Shardeum Testnet पर टेस्ट ऐप में चालू है।"></p></div>
  <div class="grid">
    <div class="card reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5z"/><path d="M12 8.6v6.8M8.6 12h6.8"/></svg></span><h3 data-en="A wallet on your phone" data-hi="फ़ोन में अपना वॉलेट"></h3><p data-en="No extension needed. Locked by a PIN, with a 12-word backup. We never hold your keys." data-hi="किसी एक्सटेंशन की ज़रूरत नहीं। PIN से बंद, 12 शब्दों का बैकअप। चाबी हम कभी नहीं रखते।"></p></div>
    <div class="card reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M10 7h7v7"/><path d="M4.8 12.2L12.2 4.8"/></svg></span><h3 data-en="Send, receive, scan" data-hi="भेजें, पाएँ, स्कैन करें"></h3><p data-en="Scan a QR code with the camera or from a photo. An address book remembers names." data-hi="कैमरे से या फ़ोटो से QR स्कैन करें। पतों की किताब नाम याद रखती है।"></p></div>
    <div class="card reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></svg></span><h3 data-en="Free test CPAY, no fee" data-hi="मुफ़्त टेस्ट CPAY, बिना फ़ीस"></h3><p data-en="New users get test coins in one tap. We cover the network fee, so nothing else is needed to start." data-hi="नए यूज़र एक टैप में टेस्ट सिक्के पाते हैं। नेटवर्क फ़ीस हम भरते हैं, इसलिए शुरू करने के लिए और कुछ नहीं चाहिए।"></p></div>

<section id="faq" style="padding-top:20px"><div class="wrap">
  <div class="reveal"><h2 data-en="Questions" data-hi="सवाल"></h2></div>
  <div class="reveal" style="margin-top:16px">
    <details><summary><span data-en="Does it use real money?" data-hi="क्या इसमें असली पैसा लगता है?"></span></summary><p data-en="No. It runs on a test network, and test coins have no value. Please do not send real funds to a test wallet." data-hi="नहीं। यह टेस्ट नेटवर्क पर चलता है, और टेस्ट सिक्कों की कोई कीमत नहीं। कृपया टेस्ट वॉलेट में असली पैसा न भेजें।"></p></details>
    <details><summary><span data-en="Is my wallet safe?" data-hi="क्या मेरा वॉलेट सुरक्षित है?"></span></summary><p data-en="Your key is created and kept on your phone, locked by your PIN, and we never receive it. Because this is an early test version, keep your 12 words safe and use it for learning only." data-hi="आपकी चाबी आपके फ़ोन में बनती और रहती है, PIN से बंद, और हमारे पास कभी नहीं आती। यह शुरुआती टेस्ट वर्शन है, इसलिए 12 शब्द सँभालकर रखिए और सिर्फ़ सीखने के लिए इस्तेमाल कीजिए।"></p></details>
    <details><summary><span data-en="What if I lose my 12 words or PIN?" data-hi="12 शब्द या PIN खो जाए तो?"></span></summary><p data-en="We cannot recover them, because we never hold them. That is the price of keeping your keys yours. Write the 12 words on paper." data-hi="हम उन्हें वापस नहीं ला सकते, क्योंकि वे हमारे पास होते ही नहीं। यही चाबी अपने पास रखने की कीमत है। 12 शब्द कागज़ पर लिख लीजिए।"></p></details>
    <details><summary><span data-en="Is CryptoPay connected to Shardeum?" data-hi="क्या CryptoPay का Shardeum से संबंध है?"></span></summary><p data-en="CryptoPay is an independent project that is built on the Shardeum Testnet. It is not affiliated with, endorsed by or sponsored by Shardeum." data-hi="CryptoPay एक स्वतंत्र प्रोजेक्ट है जो Shardeum Testnet पर बना है। इसका Shardeum से कोई संबंध, समर्थन या प्रायोजन नहीं है।"></p></details>
    <details><summary><span data-en="What data do you collect?" data-hi="आप कौन सा डेटा लेते हैं?"></span></summary><p data-en="This website has no accounts, cookies or analytics. The app has no accounts either. See the Privacy page for details." data-hi="इस वेबसाइट पर कोई खाता, कुकी या विश्लेषण नहीं है। ऐप में भी कोई खाता नहीं है। पूरी जानकारी के लिए Privacy पन्ना देखिए।"></p></details>
    <details><summary><span data-en="How can I help or give feedback?" data-hi="मैं मदद या राय कैसे दूँ?"></span></summary><p data-en="Try the app and tell us what confused you on our Telegram channel. Honest feedback is the most useful thing you can give." data-hi="ऐप आज़माइए और जो समझ न आया वह हमारे Telegram चैनल पर बताइए। ईमानदार राय सबसे काम की चीज़ है।"></p></details>
  </div>
</div></section>

function nodeHit(id){var n=$(id);n.classList.add("hit");setTimeout(function(){n.classList.remove("hit")},520)}
function frame(t,dt){
  fc.clearRect(0,0,SW,SH);
  /* dotted links */
  fc.setLineDash([3,6]);fc.lineWidth=1.2;fc.strokeStyle="rgba(111,160,255,.35)";fc.beginPath();fc.moveTo(P.n1[0],P.n1[1]);fc.lineTo(P.n2[0],P.n2[1]);fc.lineTo(P.n3[0],P.n3[1]);fc.stroke();
  fc.strokeStyle="rgba(45,212,191,.38)";fc.beginPath();fc.moveTo(P.n3[0],P.n3[1]);fc.lineTo(P.end[0],P.end[1]);fc.stroke();fc.setLineDash([]);
  var pos=null,sc=1,al=1,sq=1,u=t,names=["n1","n2","n3","end"],acc=0;
  for(var i=0;i<SEG.length;i++){
    var d=SEG[i][0];
    if(u<=acc+d){var a=P[SEG[i][1]],b=P[SEG[i][2]],f=(u-acc)/d;pos=seg(a,b,f,SEG[i][3]*(SW/420));
      if(f>.93&&i<3&&!hit[i]){hit[i]=1;burst(b[0],b[1],14);nodeHit(names[i])}
      if(f>.88&&i<3)sq=1-.2*Math.sin(Math.min(1,(f-.88)/.12)*Math.PI);
      break}
    acc+=d;
  }
  if(!pos){
    var e=u-acc;
    if(e<.45){var f2=e/.45;pos=[P.end[0],P.end[1]+f2*8];sc=1-.8*f2;al=1-f2*.9;if(!hit[3]){hit[3]=1;burst(P.end[0],P.end[1],26,1);flash()}}
  }
  if(pos){
    trail.push([pos[0],pos[1]]);if(trail.length>16)trail.shift();
    for(var q=0;q<trail.length;q++){var tt=q/trail.length;fc.fillStyle="rgba(111,160,255,"+(tt*.35)+")";fc.beginPath();fc.arc(trail[q][0],trail[q][1],P.R*.55*tt,0,6.3);fc.fill()}
    var gl=fc.createRadialGradient(pos[0],pos[1],P.R*.3,pos[0],pos[1],P.R*2.2);gl.addColorStop(0,"rgba(80,150,255,"+(.5*al)+")");gl.addColorStop(1,"rgba(80,150,255,0)");fc.fillStyle=gl;fc.beginPath();fc.arc(pos[0],pos[1],P.R*2.2,0,6.3);fc.fill();
    coinAng+=dt*(sc===1?5.2:9);drawCoin(pos[0],pos[1],P.R*sc*sq,coinAng,al);
  }else{trail.length=0}
  for(var s=sparks.length-1;s>=0;s--){var sp=sparks[s];sp.l-=dt*1.9;if(sp.l<=0){sparks.splice(s,1);continue}sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vx*=.95;sp.vy*=.95;fc.fillStyle="rgba("+sp.c+","+sp.l+")";fc.beginPath();fc.arc(sp.x,sp.y,2.2*sp.l+.4,0,6.3);fc.fill()}
}
/* ---------- main loop ---------- */
var last=0,clock=0;
function tick(ts){
  requestAnimationFrame(tick);
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!heroVisible||document.hidden)return;
  bgDraw(dt);
  clock+=dt;if(clock>TOTAL){clock=0;hit=[0,0,0,0];trail.length=0}
  frame(clock,dt);applyScroll(clock);
}
function init(){
  bgBuild();geom();
  if(reduce){fc.clearRect(0,0,SW,SH);drawCoin(P.n2[0],P.n2[1],P.R*1.2,0,1);bgDraw(0);return}
  requestAnimationFrame(tick);
}
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){bgBuild();geom()},150)});
if("IntersectionObserver"in window){new IntersectionObserver(function(es){heroVisible=es[0].isIntersecting},{threshold:0}).observe(document.getElementById("top"))}
applyLang();
var img=$("appimg");
if(img.complete)init();else{img.addEventListener("load",init);img.addEventListener("error",init)}
window.addEventListener("load",function(){geom()});
})();
</script>
